name: Apply HopperLink ONE StackScan V2

on:
  push:
    paths:
      - '.github/workflows/apply-hopper-one-stackscan-v123.yml'

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply StackScan V2 patch
        shell: bash
        run: |
          printf '%s' '' | base64 -d | gzip -d > /tmp/apply-stackscan.py
          python /tmp/apply-stackscan.py
      - name: Format canonical runtime
        run: npx --yes prettier@3.6.2 --write hopperlink-pixelstream/src/hopper-one-runtime.js
      - name: Build compressed browser runtime
        run: HOPPER_BUILD=1203 node hopperlink-pixelstream/tools/build-runtime.mjs
      - name: Validate implementation
        run: |
          node --check hopperlink-pixelstream/src/hopper-one-runtime.js
          node --check hopperlink-pixelstream/hopper-one.js
          node --check hopperlink-pixelstream/sw.js
          node --check hopperlink-pixelstream/tools/build-runtime.mjs
          node hopperlink-pixelstream/tests/hopper-one-color-modes.test.cjs
      - name: Commit StackScan V2 application files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hopperlink-pixelstream .github/workflows/hopperlink-one-check.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: add adaptive vertical StackScan V2 receiver'
          git push
