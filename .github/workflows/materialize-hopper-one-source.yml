name: Materialize HopperLink ONE Source

on:
  push:
    paths:
      - '.github/workflows/materialize-hopper-one-source.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Decode canonical runtime source
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path'),zlib=require('zlib'),crypto=require('crypto');
          const root='hopperlink-pixelstream';
          const manifest=JSON.parse(fs.readFileSync(path.join(root,'hopper-one.runtime.json'),'utf8'));
          const encoded=manifest.parts.map(part=>fs.readFileSync(path.join(root,part),'utf8').replace(/\s+/g,'')).join('');
          const source=zlib.gunzipSync(Buffer.from(encoded,'base64'));
          const sha=crypto.createHash('sha256').update(source).digest('hex');
          if(source.length!==manifest.bytes)throw new Error(`bytes ${source.length} != ${manifest.bytes}`);
          if(sha!==manifest.sha256)throw new Error(`sha ${sha} != ${manifest.sha256}`);
          fs.mkdirSync(path.join(root,'src'),{recursive:true});
          fs.writeFileSync(path.join(root,'src','hopper-one-runtime.js'),source);
          console.log(`Materialized ${source.length} bytes · ${sha}`);
          NODE
      - name: Commit canonical source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hopperlink-pixelstream/src/hopper-one-runtime.js
          git diff --cached --quiet && exit 0
          git commit -m "chore: add canonical HopperLink ONE runtime source"
          git push
