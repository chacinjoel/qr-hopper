name: Hopper receiver acquisition regression
on:
  push:
    branches: [hopper-rxfix1, main]
    paths: ['hopperlink-pixelstream/**', '.github/scripts/receiver_rxfix1.py', '.github/workflows/hopper-rxfix-check.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hopper-receiver-${{ github.ref }}
  cancel-in-progress: true
jobs:
  receiver:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded receiver-only patch on feature branch
        if: github.ref == 'refs/heads/hopper-rxfix1'
        run: python .github/scripts/receiver_rxfix1.py
      - name: Syntax, old transport integrity and acquisition regression tests
        run: |
          for f in hopperlink-pixelstream/adaptive/*.js; do node --check "$f"; done
          node --test hopperlink-pixelstream/tests/core.test.mjs hopperlink-pixelstream/adaptive/tests/*.test.mjs
      - name: Install real browser harness
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Portrait, low chroma, late joining, occlusion, stale profile and callback watchdog
        run: python hopperlink-pixelstream/adaptive/tests/acquisition_browser.py
      - name: Complete calibration, optical file and acoustic SHA-verified closure regression
        run: python hopperlink-pixelstream/adaptive/tests/browser.py
      - name: Commit only verified receiver fixes on feature branch
        if: success() && github.ref == 'refs/heads/hopper-rxfix1'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hopperlink-pixelstream/adaptive/app.js hopperlink-pixelstream/adaptive/audio.js hopperlink-pixelstream/adaptive/calibration.js hopperlink-pixelstream/adaptive/optics.js hopperlink-pixelstream/adaptive/protocol.js hopperlink-pixelstream/adaptive/qr.js hopperlink-pixelstream/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Fix Lighthouse acquisition regressions and late calibration joining; pin receiver modules'
            git push origin HEAD:hopper-rxfix1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hopper-receiver-regression-proof
          path: |
            acquisition-proof/
            adaptive-proof/
          if-no-files-found: warn
