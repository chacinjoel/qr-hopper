name: Apply HopperLink ONE Portrait Receiver

on:
  push:
    paths:
      - '.github/workflows/apply-hopper-one-receiver-portrait.yml'

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply portrait receiver viewport
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import json
          import re

          root = Path('hopperlink-pixelstream')

          def replace_one(path, old, new):
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one occurrence, found {count}: {old[:100]!r}')
              path.write_text(text.replace(old, new), encoding='utf-8')

          runtime = root / 'src' / 'hopper-one-runtime.js'
          replace_one(runtime, 'const VERSION = "1.2.1";', 'const VERSION = "1.2.2";')

          runtime_text = runtime.read_text(encoding='utf-8')
          camera_helpers = '''  function receiverScanDimensions(video) {
            const sourceWidth = Math.max(1, Number(video?.videoWidth) || 1080);
            const sourceHeight = Math.max(1, Number(video?.videoHeight) || 1920);
            const shortSide = Math.min(sourceWidth, sourceHeight);
            const longSide = Math.max(sourceWidth, sourceHeight);
            const scale = Math.min(1, 720 / shortSide, 1280 / longSide);
            return {
              width: Math.max(1, Math.round(sourceWidth * scale)),
              height: Math.max(1, Math.round(sourceHeight * scale)),
              sourceWidth,
              sourceHeight,
              portrait: sourceHeight >= sourceWidth,
            };
          }
          function syncReceiverViewport(video, track) {
            const geometry = receiverScanDimensions(video);
            const shell = $("cameraShell");
            shell.dataset.feedOrientation = geometry.portrait ? "portrait" : "landscape";
            shell.style.setProperty(
              "--camera-source-aspect",
              `${geometry.sourceWidth} / ${geometry.sourceHeight}`,
            );
            flight.record(
              "camera",
              "portrait-viewport-ready",
              {
                sourceWidth: geometry.sourceWidth,
                sourceHeight: geometry.sourceHeight,
                scanWidth: geometry.width,
                scanHeight: geometry.height,
                portrait: geometry.portrait,
                settings: track?.getSettings?.() || {},
              },
              geometry.portrait ? 100 : 72,
            );
            return geometry;
          }
'''
          anchor = '  async function startCamera() {'
          if 'function receiverScanDimensions(video)' not in runtime_text:
              if runtime_text.count(anchor) != 1:
                  raise RuntimeError('startCamera anchor not found exactly once')
              runtime_text = runtime_text.replace(anchor, camera_helpers + anchor)
          runtime.write_text(runtime_text, encoding='utf-8')

          replace_one(
              runtime,
              '''          width: { ideal: 1920 },
                    height: { ideal: 1080 },
                    frameRate: { ideal: 30, min: 15 },''',
              '''          width: { ideal: 1080 },
                    height: { ideal: 1920 },
                    aspectRatio: { ideal: 9 / 16 },
                    resizeMode: { ideal: "crop-and-scale" },
                    frameRate: { ideal: 30, min: 15 },'''
          )
          replace_one(
              runtime,
              '''      await video.play();
                await tuneCameraTrack(stream.getVideoTracks()[0]);''',
              '''      await video.play();
                await tuneCameraTrack(stream.getVideoTracks()[0]);
                syncReceiverViewport(video, stream.getVideoTracks()[0]);
                await acquireWakeLock();'''
          )
          replace_one(
              runtime,
              '''    const maxWidth = 900,
                scale = Math.min(1, maxWidth / video.videoWidth);
              const width = Math.max(320, Math.round(video.videoWidth * scale)),
                height = Math.max(220, Math.round(video.videoHeight * scale));''',
              '''    const { width, height } = receiverScanDimensions(video);'''
          )
          replace_one(
              runtime,
              '''      const native = await requestFullscreen(shell);
                shell.classList.add("receiver-fullscreen");''',
              '''      const native = await requestFullscreen(shell);
                await tryPortraitLock();
                shell.classList.add("receiver-fullscreen");'''
          )
          replace_one(
              runtime,
              '''    app.cameraStream = null;
              const video = $("cameraVideo");''',
              '''    app.cameraStream = null;
              releaseWakeLock();
              try {
                screen.orientation?.unlock?.();
              } catch {}
              const video = $("cameraVideo");'''
          )
          replace_one(runtime, '$("cameraState").textContent = "AUTODOCK 3·BUSCANDO";', '$("cameraState").textContent = "AUTODOCK 3·VERTICAL·BUSCANDO";')

          runtime_text = runtime.read_text(encoding='utf-8')
          runtime_text, count = re.subn(r'"\./sw\.js\?v=1201"', '"./sw.js?v=1202"', runtime_text)
          if count != 1:
              raise RuntimeError(f'runtime service-worker version replacements: {count}')
          export_anchor = '''    classifyColorSamples,
              crc32,'''
          export_replacement = '''    classifyColorSamples,
              receiverScanDimensions,
              crc32,'''
          if runtime_text.count(export_anchor) != 1:
              raise RuntimeError('internals export anchor not found')
          runtime_text = runtime_text.replace(export_anchor, export_replacement)
          runtime.write_text(runtime_text, encoding='utf-8')

          css = root / 'premium-one-receiver.css'
          replace_one(
              css,
              '''.camera-shell{
            position:relative;aspect-ratio:16/9;min-height:260px;overflow:hidden;
            border:1px solid var(--line);border-radius:20px;background:#020409;box-shadow:inset 0 0 60px rgba(0,0,0,.75)
          }
          .camera-shell video,.camera-shell>canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}
          .camera-shell>canvas{z-index:2;pointer-events:none}''',
              '''.camera-shell{
            position:relative;width:min(100%,520px);aspect-ratio:9/16;min-height:0;margin-inline:auto;overflow:hidden;
            border:1px solid var(--line);border-radius:20px;background:#000;box-shadow:inset 0 0 60px rgba(0,0,0,.75)
          }
          .camera-shell video,.camera-shell>canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
          .camera-shell video{background:#000}
          .camera-shell>canvas{z-index:2;pointer-events:none;background:transparent}'''
          )
          replace_one(
              css,
              '''.camera-shell.receiver-fullscreen{
            position:fixed;inset:0;z-index:5000;width:100vw;height:100vh;height:100dvh;min-height:0;aspect-ratio:auto;border-radius:0;border:0
          }''',
              '''.camera-shell.receiver-fullscreen{
            position:fixed;inset:auto;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5000;
            width:min(100vw,56.25vh);width:min(100vw,56.25dvh);
            height:min(100vh,177.7778vw);height:min(100dvh,177.7778vw);
            min-height:0;max-width:none;aspect-ratio:9/16;border-radius:0;border:0;background:#000;
            box-shadow:0 0 0 100vmax #000,inset 0 0 60px rgba(0,0,0,.75)
          }'''
          )

          index = root / 'index.html'
          text = index.read_text(encoding='utf-8').replace('v=1201', 'v=1202')
          text = text.replace('HopperCore 1.2.1 · TriFrame vertical 3-Lane', 'HopperCore 1.2.2 · TriFrame vertical 3-Lane')
          text = text.replace('AutoDock 3 encuentra y recorta los tres cuadrantes', 'AutoDock 3 encuadra la columna vertical y recorta los tres cuadrantes')
          text = text.replace('Incluye la pantalla emisora completa. AutoDock 3 hará el resto.', 'Sostén ambos dispositivos verticales e incluye completa la columna A/B/C.')
          text = text.replace('La geometría se conservará en HELLO y DATA.', 'La vista 9:16 conserva la columna A/B/C en HELLO y DATA.')
          text = text.replace('>Vista fullscreen</button>', '>Vista fullscreen 9:16</button>')
          text = text.replace('<title>HopperLink ONE · Color TriFrame</title>', '<title>HopperLink ONE · Color TriFrame Vertical</title>')
          index.write_text(text, encoding='utf-8')

          loader = root / 'hopper-one.js'
          loader.write_text(loader.read_text(encoding='utf-8').replace('v=1201', 'v=1202'), encoding='utf-8')

          sw = root / 'sw.js'
          sw.write_text(sw.read_text(encoding='utf-8').replace('v1201', 'v1202').replace('v=1201', 'v=1202'), encoding='utf-8')

          build = root / 'tools' / 'build-runtime.mjs'
          replace_one(build, "process.env.HOPPER_BUILD || '1201'", "process.env.HOPPER_BUILD || '1202'")

          manifest = root / 'manifest.json'
          manifest_data = json.loads(manifest.read_text(encoding='utf-8'))
          manifest_data['name'] = 'HopperLink ONE Vertical TriFrame'
          manifest_data['orientation'] = 'portrait'
          manifest_data['description'] = 'Transferencia offline premium con emisor y receptor verticales, visor de cámara 9:16, tres lanes apilados y modulación de 2, 3 y 4 bits.'
          manifest.write_text(json.dumps(manifest_data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          readme = root / 'README.md'
          readme_text = readme.read_text(encoding='utf-8')
          readme_text = readme_text.replace('# HopperLink ONE · HopperCore 1.2.1', '# HopperLink ONE · HopperCore 1.2.2')
          marker = '- **AutoDock 3:** detecta, ordena y corrige la perspectiva de los tres marcos cian.\n'
          addition = '- **Receiver Portrait 9:16:** solicita cámara 1080×1920, conserva la proporción sin estirar el video y alinea el canvas de AutoDock con la imagen visible.\n'
          if marker in readme_text and addition not in readme_text:
              readme_text = readme_text.replace(marker, marker + addition)
          readme.write_text(readme_text, encoding='utf-8')

          test = root / 'tests' / 'hopper-one-color-modes.test.cjs'
          test_text = test.read_text(encoding='utf-8')
          test_text = test_text.replace("I.VERSION,'1.2.1'", "I.VERSION,'1.2.2'")
          test_text = test_text.replace("manifest.build,'1201'", "manifest.build,'1202'")
          test_text = test_text.replace("sw.includes('hopperlink-one-v1201')", "sw.includes('hopperlink-one-v1202')")
          old_log = "console.log('HopperLink ONE Color Modes + Portrait Stack: PASS');"
          new_checks = """const receiverCss=fs.readFileSync(path.join(root,'premium-one-receiver.css'),'utf8');
          assert(receiverCss.includes('aspect-ratio:9/16'));
          assert(receiverCss.includes('object-fit:contain'));
          assert(receiverCss.includes('width:min(100vw,56.25dvh)'));
          assert(source.includes('width: { ideal: 1080 }'));
          assert(source.includes('height: { ideal: 1920 }'));
          assert(source.includes('aspectRatio: { ideal: 9 / 16 }'));
          const portraitScan=I.receiverScanDimensions({videoWidth:1080,videoHeight:1920});
          assert.strictEqual(portraitScan.width,720);
          assert.strictEqual(portraitScan.height,1280);
          assert.strictEqual(portraitScan.portrait,true);
          assert(html.includes('Vista fullscreen 9:16'));
          console.log('HopperLink ONE Color Modes + Portrait TX/RX: PASS');"""
          if test_text.count(old_log) != 1:
              raise RuntimeError('test log anchor not found')
          test_text = test_text.replace(old_log, new_checks)
          test.write_text(test_text, encoding='utf-8')

          print('Applied portrait receiver viewport and scan geometry.')
          PY

      - name: Format canonical runtime
        run: npx --yes prettier@3.6.2 --write hopperlink-pixelstream/src/hopper-one-runtime.js

      - name: Build compressed browser runtime
        run: HOPPER_BUILD=1202 node hopperlink-pixelstream/tools/build-runtime.mjs

      - name: Validate implementation
        run: |
          node --check hopperlink-pixelstream/src/hopper-one-runtime.js
          node --check hopperlink-pixelstream/hopper-one.js
          node --check hopperlink-pixelstream/sw.js
          node --check hopperlink-pixelstream/tools/build-runtime.mjs
          node hopperlink-pixelstream/tests/hopper-one-color-modes.test.cjs

      - name: Commit receiver portrait application files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hopperlink-pixelstream/index.html
          git add hopperlink-pixelstream/premium-one-receiver.css
          git add hopperlink-pixelstream/src/hopper-one-runtime.js
          git add hopperlink-pixelstream/hopper-one.js
          git add hopperlink-pixelstream/hopper-one.runtime.json
          git add hopperlink-pixelstream/runtime/hopper-one.bundle-01.txt
          git add hopperlink-pixelstream/runtime/hopper-one.bundle-02.txt
          git add hopperlink-pixelstream/sw.js
          git add hopperlink-pixelstream/manifest.json
          git add hopperlink-pixelstream/README.md
          git add hopperlink-pixelstream/tools/build-runtime.mjs
          git add hopperlink-pixelstream/tests/hopper-one-color-modes.test.cjs
          git diff --cached --quiet && exit 0
          git commit -m 'feat: add portrait 9:16 receiver viewport and scan pipeline'
          git push
