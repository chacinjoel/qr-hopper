name: Publish HopperLink ONE StackScan V2

on:
  push:
    paths:
      - '.github/workflows/apply-hopper-one-stackscan-v123b.yml'

permissions:
  contents: write

jobs:
  apply-validate-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recover and apply validated StackScan patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import base64, gzip, re
          workflow = Path('.github/workflows/apply-hopper-one-stackscan-v123.yml').read_text(encoding='utf-8')
          match = re.search(r"printf '%s' '([^']+)' \| base64 -d \| gzip -d > /tmp/apply-stackscan\.py", workflow)
          if not match:
              raise RuntimeError('Embedded StackScan patch was not found')
          Path('/tmp/apply-stackscan.py').write_bytes(gzip.decompress(base64.b64decode(match.group(1))))
          PY
          python /tmp/apply-stackscan.py
      - name: Format canonical runtime
        run: npx --yes prettier@3.6.2 --write hopperlink-pixelstream/src/hopper-one-runtime.js
      - name: Build compressed browser runtime
        run: HOPPER_BUILD=1203 node hopperlink-pixelstream/tools/build-runtime.mjs
      - name: Validate StackScan V2
        run: |
          node --check hopperlink-pixelstream/src/hopper-one-runtime.js
          node --check hopperlink-pixelstream/hopper-one.js
          node --check hopperlink-pixelstream/sw.js
          node --check hopperlink-pixelstream/tools/build-runtime.mjs
          node hopperlink-pixelstream/tests/hopper-one-color-modes.test.cjs
      - name: Publish application files only
        shell: bash
        run: |
          git checkout -- .github/workflows/hopperlink-one-check.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hopperlink-pixelstream
          git diff --cached --quiet && exit 0
          git commit -m 'fix: add adaptive vertical StackScan V2 receiver'
          git push
