name: HopperLink adaptive and legacy regression
on:
  push:
    branches: [main]
    paths: ['hopperlink-pixelstream/**', '.github/workflows/hopperlink-static-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and legacy/adaptive protocol regressions
        run: |
          for f in hopperlink-pixelstream/adaptive/*.js; do node --check "$f"; done
          node --test hopperlink-pixelstream/tests/core.test.mjs hopperlink-pixelstream/adaptive/tests/adaptive.test.mjs
      - name: Browser harness
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Legacy browser regression
        run: python hopperlink-pixelstream/tests/browser_smoke.py
      - name: Optical and acoustic paired-browser negotiation through production code
        run: python hopperlink-pixelstream/adaptive/tests/browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hopper-adaptive-browser-proof
          path: adaptive-proof/
          if-no-files-found: ignore
