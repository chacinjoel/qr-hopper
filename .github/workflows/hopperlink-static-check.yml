name: HopperLink static check
on:
  push:
    paths:
      - 'hopperlink-pixelstream/**'
      - '.github/workflows/hopperlink-static-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate page resources and module syntax
        run: |
          python3 - <<'PY'
          import json, pathlib, re
          p=pathlib.Path('hopperlink-pixelstream')
          json.loads((p/'manifest.json').read_text())
          html=(p/'index.html').read_text()
          assert 'app-metrics.js' in html
          for path in re.findall(r'(?:src|href)="(\./[^"]+)"', html):
              assert (p/path.split('?')[0]).exists(), path
          for raw in re.findall(r'<script type="importmap">(.*?)</script>',html,re.S):
              for path in json.loads(raw)['imports'].values():
                  assert (p/path.split('?')[0]).exists(), path
          print('HTML, manifest and versioned import map OK')
          PY
          for f in hopperlink-pixelstream/app-metrics.js hopperlink-pixelstream/src/*.js; do
            node --input-type=module --check < "$f"
          done
      - name: Test metrics, feedback CRC, selective repair and frozen DATA protocol
        run: node --test hopperlink-pixelstream/tests/core.test.mjs
      - name: Install browser test tools
        run: |
          python3 -m pip install playwright==1.55.0
          python3 -m playwright install --with-deps chromium
      - name: Browser load and synthetic optical loopback
        run: python3 hopperlink-pixelstream/tests/browser_smoke.py
