name: HopperLink ONE Runtime Check

on:
  push:
    paths:
      - 'hopperlink-pixelstream/**'
      - '.github/workflows/hopperlink-one-check.yml'
  pull_request:
    paths:
      - 'hopperlink-pixelstream/**'
      - '.github/workflows/hopperlink-one-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check active JavaScript syntax
        run: |
          node --check hopperlink-pixelstream/src/hopper-one-runtime.js
          node --check hopperlink-pixelstream/anchor-scan.js
          node --check hopperlink-pixelstream/anchor-worker.js
          node --check hopperlink-pixelstream/hopper-one.js
          node --check hopperlink-pixelstream/sw.js
          node --check hopperlink-pixelstream/tools/build-runtime.mjs
      - name: Rebuild deterministic H7 Static Guide runtime
        run: HOPPER_BUILD=1500 node hopperlink-pixelstream/tools/build-runtime.mjs
      - name: Validate static guide acquisition contract
        run: |
          grep -q 'const VERSION = "1.5.0"' hopperlink-pixelstream/src/hopper-one-runtime.js
          grep -q 'const PROTOCOL = 5' hopperlink-pixelstream/src/hopper-one-runtime.js
          grep -q 'GUIDE_FLAG = 0x40' hopperlink-pixelstream/src/hopper-one-runtime.js
          grep -q 'function acceptQuickGuide' hopperlink-pixelstream/src/hopper-one-runtime.js
          grep -q 'guidePackets=\[0,1,2\].map(quickGuidePacket)' hopperlink-pixelstream/src/hopper-one-runtime.js
          ! grep -q 'startHelloCarousel();' hopperlink-pixelstream/src/hopper-one-runtime.js
          ! grep -R 'v=1400\|build:"1400"' hopperlink-pixelstream/src hopperlink-pixelstream/anchor-worker.js hopperlink-pixelstream/index.html hopperlink-pixelstream/sw.js
      - name: Validate color modes and packet integrity
        run: node hopperlink-pixelstream/tests/hopper-one-color-modes.test.cjs
      - name: Guard unobstructed optical surface
        run: node hopperlink-pixelstream/tests/hopper-one-unobstructed.test.cjs
      - name: Ensure generated files are committed
        run: git diff --exit-code -- hopperlink-pixelstream/hopper-one.runtime.json hopperlink-pixelstream/runtime
      - name: Install browser harness
        shell: bash
        run: |
          python -m pip install playwright==1.55.0
          if ! command -v google-chrome >/dev/null && ! command -v chromium >/dev/null; then
            python -m playwright install --with-deps chromium
          fi
      - name: Recover filenames and full files through production worker
        env:
          H7_PROOF_DIR: h7-browser-proof
        run: python hopperlink-pixelstream/tests/hopper-one-browser.py
      - name: Preserve rendered UI and receiver evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h7-static-guide-browser-proof
          path: h7-browser-proof/
          if-no-files-found: ignore
