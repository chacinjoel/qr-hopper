name: HopperLink runtime regression

on:
  push:
    paths:
      - 'hopperlink-pixelstream/**'
      - '.github/workflows/hopperlink-one-check.yml'
  pull_request:
    paths:
      - 'hopperlink-pixelstream/**'
      - '.github/workflows/hopperlink-one-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate current HDP runtime rather than removed H7 files
        run: |
          node --input-type=module --check < hopperlink-pixelstream/app-metrics.js
          node --test hopperlink-pixelstream/tests/core.test.mjs
      - name: Identify full browser validation
        run: echo 'HTTP load and synthetic optical camera tests are in hopperlink-static-check.yml; no physical torch claim is made by these tests.'
