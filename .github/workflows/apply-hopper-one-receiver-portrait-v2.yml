name: Apply HopperLink ONE Portrait Receiver v2

on:
  push:
    paths:
      - '.github/workflows/apply-hopper-one-receiver-portrait-v2.yml'

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply portrait receiver viewport
        run: python hopperlink-pixelstream/tools/apply-receiver-portrait.py
      - name: Format canonical runtime
        run: npx --yes prettier@3.6.2 --write hopperlink-pixelstream/src/hopper-one-runtime.js
      - name: Build compressed browser runtime
        run: HOPPER_BUILD=1202 node hopperlink-pixelstream/tools/build-runtime.mjs
      - name: Validate implementation
        run: |
          node --check hopperlink-pixelstream/src/hopper-one-runtime.js
          node --check hopperlink-pixelstream/hopper-one.js
          node --check hopperlink-pixelstream/sw.js
          node --check hopperlink-pixelstream/tools/build-runtime.mjs
          node hopperlink-pixelstream/tests/hopper-one-color-modes.test.cjs
      - name: Commit receiver portrait application files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f hopperlink-pixelstream/tools/apply-receiver-portrait.py
          git add hopperlink-pixelstream
          git diff --cached --quiet && exit 0
          git commit -m 'feat: add portrait 9:16 receiver viewport and scan pipeline'
          git push
