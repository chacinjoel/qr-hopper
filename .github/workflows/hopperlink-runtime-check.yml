name: HopperLink Runtime Check

on:
  push:
    paths:
      - 'hopperlink-pixelstream/**'
      - '.github/workflows/hopperlink-runtime-check.yml'
  workflow_dispatch:

jobs:
  syntax-and-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          set -e
          for f in hopperlink-pixelstream/*.js; do node --check "$f"; done

      - name: Validate HPS7 Precision + HPS8 Strict ACK v0.10.12
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const p='hopperlink-pixelstream',read=n=>fs.readFileSync(`${p}/${n}`,'utf8');
          const core=read('hps7.js'),manual=read('hps7-manual-max.js'),dual=read('hps7-duallane-v2.js'),guard=read('runtime-syntax-guard.js');
          const sonic=read('hps8-sonic-adaptive.js'),slot=read('hps8-sonic-slot-decoder.js'),strict=read('hps8-strict-ack.js'),ackWake=read('hps8-ack-wake.js'),diag=read('hps8-diagnostics.js'),hps8=read('hps8.js'),html=read('index.html'),sw=read('sw.js');

          // HPS7 stable fallback must remain unchanged.
          if(!core.includes('const DATA_MIN = .12, DATA_MAX = .88;'))throw Error('HPS7 DATA region changed');
          if(!core.includes('const DATA_GRIDS = [56,64,72];'))throw Error('HPS7 grids changed');
          function extract(text,name){const a=text.indexOf('function replaceOne'),b=text.indexOf('\nfunction loadScript',a);if(a<0||b<=a)throw Error(`Cannot extract ${name}`);return new Function(`${text.slice(a,b)}; return ${name};`)();}
          const generated=extract(dual,'patchDual')(extract(manual,'patchCore')(core));
          class CE{constructor(type,init={}){this.type=type;this.detail=init.detail}}
          let guardEvent=null;const gc={console,CustomEvent:CE,dispatchEvent:e=>{if(e.type==='hopper:runtime-syntax-fixed')guardEvent=e.detail;},window:null};gc.window=gc;vm.createContext(gc);vm.runInContext(guard,gc);const compiled=gc.Function(`${generated}\n//# sourceURL=hps7-core-v-ci.js`),body=compiled.toString();
          if(!guardEvent?.precisionScannerInjected||!guardEvent?.normalizerInjected||!body.includes('TRACK HOLD'))throw Error('HPS7 Precision regression');
          console.log('HPS7 Precision fallback: PASS');

          // Sonic physical modem + PLL remain available.
          for(const s of ["VERSION='0.10.4'",'clockedBfsk:true','hammingFec:true','persistentDuplex:true'])if(!sonic.includes(s))throw Error(`Base Sonic missing ${s}`);
          for(const s of ["VERSION='0.10.10'",'deterministicPll:true','headerOnly:true','START_LOCK','SYNC_SEARCH','decodeCodewordSoft'])if(!slot.includes(s))throw Error(`Sonic PLL missing ${s}`);

          // Strict ACK is the only automatic-start authorization filter.
          for(const s of ["VERSION='0.10.12'",'fullCrcRequired:true','headerOnlyRejected:true','startLockCannotStartData:true','msg.ok!==true','msg.headerOnly===true','p.length===1&&p[0]===1','strictAckOnly=true'])if(!strict.includes(s))throw Error(`Strict ACK missing ${s}`);
          const fakeS={type:{ACK:1},startListener:async cb=>{fakeS.cb=cb;return true;}};
          const sc={console,window:null,document:{getElementById(){return null}},CustomEvent:CE,Uint8Array};sc.window=sc;sc.__hopperHPS8Sonic=fakeS;sc.dispatchEvent=()=>true;vm.createContext(sc);vm.runInContext(strict,sc);
          const accepted=[];await sc.__hopperHPS8Sonic.startListener(m=>accepted.push(m));
          fakeS.cb({type:1,ok:true,headerOnly:true,earlyAck:true,session:1,payload:new Uint8Array([1])});
          fakeS.cb({type:1,ok:false,session:1,payload:new Uint8Array([1])});
          fakeS.cb({type:1,ok:true,session:1,payload:new Uint8Array([9])});
          if(accepted.length!==0)throw Error('Strict ACK accepted unsafe ACK');
          fakeS.cb({type:1,ok:true,session:0x1234,payload:new Uint8Array([1])});
          if(accepted.length!==1||!accepted[0].strictAck)throw Error('Strict ACK rejected full CRC ACK');
          console.log('HPS8 Strict ACK filtering: PASS');

          // The old START wake implementation is now diagnostic-only and can never click DATA.
          for(const s of ["VERSION='0.10.12'",'active:false','startLockWake:false','autoStartFromStart:false','diagnosticOnly:true','strictAckOnly:true'])if(!ackWake.includes(s))throw Error(`ACK Wake disable missing ${s}`);
          if(ackWake.includes('.click()')||ackWake.includes('triggerFallback')||ackWake.includes('setTimeout(triggerFallback'))throw Error('Unsafe ACK Wake auto-start still present');
          console.log('Unsafe START/CLOCK auto-start removed: PASS');

          // HPS8 core must still require exact session equality before handling any control message.
          if(!hps8.includes('if(!tx||msg.session!==tx.session)return;'))throw Error('HPS8 session gate missing');
          if(!hps8.includes('if(msg.type===T.ACK)'))throw Error('HPS8 ACK handler missing');
          for(const s of ['sonicDiagClock','sonicDiagSync','sonicDiagFrame','sonicDiagFec','sonicDiagCrc'])if(!diag.includes(s))throw Error(`Diagnostics missing ${s}`);

          // Load order: base -> PLL -> Strict ACK -> diagnostics -> HPS8.
          for(const s of ['MVP v0.10.12 · HPS8 Strict ACK','hps8-sonic-adaptive.js?v=1012','hps8-sonic-slot-decoder.js?v=1012','hps8-strict-ack.js?v=1012','hps8-diagnostics.js?v=1012','hps8.js?v=1012'])if(!html.includes(s))throw Error(`HTML v1012 missing ${s}`);
          const a=html.indexOf('hps8-sonic-adaptive.js?v=1012'),b=html.indexOf('hps8-sonic-slot-decoder.js?v=1012'),c=html.indexOf('hps8-strict-ack.js?v=1012'),d=html.indexOf('hps8-diagnostics.js?v=1012'),e=html.indexOf('hps8.js?v=1012');
          if(!(a>=0&&b>a&&c>b&&d>c&&e>d))throw Error('Strict ACK load order invalid');
          if(!sw.includes("hopperlink-pixelstream-v1012")||!sw.includes('hps8-strict-ack.js?v=1012')||sw.includes('hps8-ack-wake.js?v=1011'))throw Error('SW v1012 strict cache invalid');
          console.log('HPS7 + HPS8 v0.10.12 Strict ACK integration: PASS');
          NODE
