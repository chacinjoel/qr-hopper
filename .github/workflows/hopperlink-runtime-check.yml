name: HopperLink Runtime Check

on:
  push:
    paths:
      - 'hopperlink-pixelstream/**'
      - '.github/workflows/hopperlink-runtime-check.yml'
  workflow_dispatch:

jobs:
  syntax-and-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          set -e
          for f in hopperlink-pixelstream/*.js; do
            echo "Checking $f"
            node --check "$f"
          done
      - name: Validate Manual Max runtime
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const p='hopperlink-pixelstream';
          const runtime=fs.readFileSync(`${p}/hps7-manual-max.js`,'utf8');
          const core=fs.readFileSync(`${p}/hps7.js`,'utf8');
          const guard=fs.readFileSync(`${p}/runtime-syntax-guard.js`,'utf8');
          const bridge=fs.readFileSync(`${p}/binary-tag-bridge-fast.js`,'utf8');
          const warmup=fs.readFileSync(`${p}/color-warmup.js`,'utf8');
          const html=fs.readFileSync(`${p}/index.html`,'utf8');
          const sw=fs.readFileSync(`${p}/sw.js`,'utf8');

          const a=runtime.indexOf('function replaceOne'),b=runtime.indexOf('function loadScript');
          if(a<0||b<=a)throw new Error('patchCore not found');
          const pc={console};vm.createContext(pc);vm.runInContext(runtime.slice(a,b)+'\n;globalThis.__patchCore=patchCore;',pc,{filename:'manual-max-patch.js'});
          const patched=pc.__patchCore(core);

          let rawErr=null;try{new Function(patched);}catch(e){rawErr=e;}
          const events=[],g={Function,dispatchEvent:e=>events.push(e)};
          class CE{constructor(type,init={}){this.type=type;this.detail=init.detail;}}
          const gc={globalThis:g,CustomEvent:CE,console,Object};vm.createContext(gc);vm.runInContext(guard,gc,{filename:'runtime-syntax-guard.js'});
          const compiled=g.Function(`${patched}\n//# sourceURL=hps7-core-v098.js`);
          if(typeof compiled!=='function')throw new Error('guarded core did not compile');
          if(g.Function!==Function)throw new Error('native Function not restored');
          if(rawErr&&!events.some(e=>e.type==='hopper:runtime-syntax-fixed'))throw new Error('syntax guard did not fire');
          console.log('Generated HPS7 Manual Max compile: PASS');

          for(const n of [
            'const BASE_CHUNK = 367;',
            'n>0&&n<=500?3:1',
            "bits===2)return{label:'2-bit Max',fps:15",
            "bits===3)return{label:'3-bit Max',fps:12",
            "return{label:'4-bit Max',fps:10",
            'SIN NACK intermedio',
            'repairPrerollMs(bits)',
            'trackedSuccess%30===0',
            'window.__hopperBinaryTagBridge?.last'
          ]) if(!patched.includes(n))throw new Error(`Missing manual-max invariant: ${n}`);

          const HEADER=28,PILOT=32,GRID=56,BASE=367;
          const payload=bits=>Math.floor((GRID*GRID-PILOT)*bits/8)-HEADER;
          const chunks=bits=>Math.max(1,Math.floor((payload(bits)-1)/(BASE+6)));
          const got=[chunks(2),chunks(3),chunks(4)];
          if(JSON.stringify(got)!==JSON.stringify([2,3,4]))throw new Error(`Grid56 packing wrong: ${got}`);
          const bps=[2*BASE*15,3*BASE*12,4*BASE*10];
          console.log('Grid56 packing: 2-bit=2, 3-bit=3, 4-bit=4 blocks/frame · B/s',bps.join(','));

          for(const n of ['adaptiveDetection:true','frameSeq%3!==0','frameSeq%2!==0','Math.min(w,h)/200','reuseMemory'])if(!bridge.includes(n))throw new Error(`Fast bridge missing ${n}`);
          for(const n of ["bits===2){log('2-bit gris: sin warm-up",'bits===3?2:3'])if(!warmup.includes(n))throw new Error(`Warmup invariant missing ${n}`);
          if(html.includes('HAC5')||html.includes('acoustic'))throw new Error('Manual Max UI still exposes acoustic mode');
          for(const n of ['MVP v0.9.8 · Manual Max','value="maxcal" selected','Max Gray · 2-bit','Max Color · 3-bit','Max Color · 4-bit'])if(!html.includes(n))throw new Error(`UI missing ${n}`);
          const gp=html.indexOf('runtime-syntax-guard.js?v=098'),bp=html.indexOf('binary-tag-bridge-fast.js?v=098'),rp=html.indexOf('hps7-manual-max.js?v=098');
          if(gp<0||bp<0||rp<0||!(gp<bp&&bp<rp))throw new Error('load order guard -> fast bridge -> manual max failed');
          for(const asset of ['runtime-syntax-guard.js?v=098','binary-tag-bridge-fast.js?v=098','hps7-manual-max.js?v=098','color-warmup.js?v=098','transfer-telemetry.js?v=098'])if(!sw.includes(asset))throw new Error(`SW missing ${asset}`);
          if(!sw.includes('hopperlink-pixelstream-v098'))throw new Error('cache key not v098');
          console.log('v0.9.8 Manual Max invariants: PASS');
          NODE
