name: HopperLink Runtime Check

on:
  push:
    paths:
      - 'hopperlink-pixelstream/**'
      - '.github/workflows/hopperlink-runtime-check.yml'
  workflow_dispatch:

jobs:
  syntax-and-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          set -e
          for f in hopperlink-pixelstream/*.js; do node --check "$f"; done

      - name: Validate HPS7 + HPS8 Sonic full-duplex v0.10.3
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const p='hopperlink-pixelstream',read=n=>fs.readFileSync(`${p}/${n}`,'utf8');
          const sonic=read('hps8-sonic-adaptive.js'),diag=read('hps8-diagnostics.js'),fountain=read('hps8-fountain.js'),hps8=read('hps8.js'),core=read('hps7.js'),dual=read('hps7-duallane-v2.js'),guard=read('runtime-syntax-guard.js');

          for(const s of ["VERSION='0.10.3'",'persistentDuplex:true','userGesturePrime:true','primeDuplex','unlockOutput','duplexState:stateSnapshot','listener reutilizado','speaker unlock','DUPLEX READY'])if(!sonic.includes(s))throw Error(`Sonic duplex missing ${s}`);
          const primePos=sonic.indexOf('async function primeDuplex');
          const unlockPos=sonic.indexOf('await unlockOutput()',primePos),listenPos=sonic.indexOf('await startListener(onMessage)',primePos);
          if(!(primePos>=0&&unlockPos>primePos&&listenPos>unlockPos))throw Error('primeDuplex must unlock output before microphone/listener');
          if(!sonic.includes("if(micLive()&&analyser&&listenTimer&&micCtx&&micCtx.state!=='closed')"))throw Error('listener reuse guard missing');
          if(!sonic.includes("outputUnlocked&&outCtx?.state==='running'&&inputReady&&micLive()&&micCtx?.state==='running'&&analyser&&listenTimer"))throw Error('duplex-ready invariant incomplete');
          if(!sonic.includes('fftSize=512')||!sonic.includes('TONE_MS=22,GAP_MS=22'))throw Error('guarded symbol timing regression');
          for(const s of ['high:{name:\'HIGH\'','mid:{name:\'MID\'','safe:{name:\'SAFE\''])if(!sonic.includes(s))throw Error(`adaptive band missing ${s}`);
          console.log('Sonic8 persistent full-duplex architecture: PASS');

          for(const s of ["version:'0.10.3'",'persistentDuplex:true','userGesturePrime:true','primeFromGesture','installGesturePrime','MIC ✓ · SPEAKER ✓ · DSP ✓ · DUPLEX READY','PONG enviado automáticamente sin cerrar el listener','El listener permanece vivo esperando PONG'])if(!diag.includes(s))throw Error(`Diagnostics duplex invariant missing ${s}`);
          if(diag.includes("state.ping=null;render();nativeStop()"))throw Error('PING/PONG still stops listener after success');
          if(diag.includes("await S.startListener(()=>{});pingTimer"))throw Error('PING test still reopens listener after transmit');
          console.log('Sonic8 persistent PING/PONG diagnostics: PASS');

          class CE{constructor(type,init={}){this.type=type;this.detail=init.detail}}
          const doc={getElementById(){return null},createElement(){return{}},querySelector(){return null}};
          const c={console,window:null,document:doc,navigator:{mediaDevices:{}},CustomEvent:CE,setInterval:()=>0,clearInterval(){},performance};c.window=c;c.dispatchEvent=()=>true;vm.createContext(c);vm.runInContext(sonic,c,{timeout:1500});const S=c.__hopperHPS8Sonic;if(!S)throw Error('Sonic export missing');
          const payload=S.progressPayload(734,21,1),packet=S.pack(S.type.PROGRESS,0x1234abcd,payload),sym=S.bytesToSymbols(packet),back=S.symbolsToBytes(sym),parsed=S.unpack(back);if(!parsed?.ok||parsed.session!==0x1234abcd)throw Error('Sonic framing regression');
          if(!S.adaptiveBands||!S.guardedSymbols||!S.persistentDuplex||!S.userGesturePrime)throw Error('Sonic export flags missing');
          console.log('Sonic8 framing + adaptive/duplex exports: PASS');

          const fc={console,window:null};fc.window=fc;vm.createContext(fc);vm.runInContext(fountain,fc,{timeout:1500});const F=fc.__hopperHPS8Fountain,N=64,SZ=96,blocks=Array.from({length:N},(_,i)=>Uint8Array.from({length:SZ},(_,j)=>(i*31+j*17)&255)),dec=F.createDecoder(N,SZ);for(let i=0;i<N;i++)if(i%4)dec.addSystematic(i,blocks[i]);for(let seed=1;seed<16000&&!dec.complete;seed++){const x=F.makeParity(blocks,seed);dec.addParity(seed,x.data);}if(!dec.complete)throw Error('Fountain recovery regression');
          console.log('PhotonFountain 25% systematic-loss recovery: PASS');

          if(core.length<5000||!core.includes('sampleGridRGB'))throw Error('HPS7 core fallback missing/too small');
          if(!dual.includes('patchDual'))throw Error('HPS7 DualLane fallback missing');
          if(!guard.includes('photometricNormalizer:true'))throw Error('HPS7 photometric guard missing');
          if(!hps8.includes('sonicAutoRepair:true')||!hps8.includes('PhotonFountain'))throw Error('HPS8 runtime regression');
          console.log('HPS7 fallback + HPS8 runtime invariants: PASS');
          NODE
