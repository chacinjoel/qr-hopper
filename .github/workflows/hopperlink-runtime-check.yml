name: HopperLink Runtime Check

on:
  push:
    paths:
      - 'hopperlink-pixelstream/**'
      - '.github/workflows/hopperlink-runtime-check.yml'
  workflow_dispatch:

jobs:
  syntax-and-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          set -e
          for f in hopperlink-pixelstream/*.js; do
            echo "Checking $f"
            node --check "$f"
          done
      - name: Validate HPS7 hybrid runtime
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const p='hopperlink-pixelstream';
          const runtime=fs.readFileSync(`${p}/hps7-runtime.js`,'utf8');
          const core=fs.readFileSync(`${p}/hps7.js`,'utf8');
          const guard=fs.readFileSync(`${p}/runtime-syntax-guard.js`,'utf8');
          const hybrid=fs.readFileSync(`${p}/hybrid-control.js`,'utf8');
          const html=fs.readFileSync(`${p}/index.html`,'utf8');
          const sw=fs.readFileSync(`${p}/sw.js`,'utf8');

          const a=runtime.indexOf('function replaceOne'),b=runtime.indexOf('function loadScript');
          if(a<0||b<=a)throw new Error('patchCore not found');
          const pc={console};vm.createContext(pc);vm.runInContext(runtime.slice(a,b)+'\n;globalThis.__patchCore=patchCore;',pc,{filename:'runtime-patch.js'});
          const patched=pc.__patchCore(core);
          let rawErr=null;try{new Function(patched);}catch(e){rawErr=e;}
          console.log('Raw patched core:',rawErr?rawErr.message:'compiles directly');

          const events=[],g={Function,dispatchEvent:e=>events.push(e)};
          class CE{constructor(type,init={}){this.type=type;this.detail=init.detail;}}
          const gc={globalThis:g,CustomEvent:CE,console,Object};vm.createContext(gc);vm.runInContext(guard,gc,{filename:'runtime-syntax-guard.js'});
          const compiled=g.Function(`${patched}\n//# sourceURL=hps7-core-v096.js`);
          if(typeof compiled!=='function')throw new Error('guarded HPS7 compile did not return Function');
          if(g.Function!==Function)throw new Error('native Function was not restored');
          if(rawErr&&!events.some(e=>e.type==='hopper:runtime-syntax-fixed'))throw new Error('syntax guard did not fire');
          console.log('Guarded HPS7 compile: PASS');

          for(const needle of [
            'window.HopperHybrid.prepareSender',
            'window.HopperHybrid.waitReady',
            'showNackHybrid',
            'showCompleteHybrid',
            "cameraMode==='senderControl'?'user':'environment'",
            'Repair detectado automáticamente',
            'AUTO REPAIR',
            'setTimeout(()=>sendRepair(),300)',
            'receiverCameraContinuous:true',
            'frontCameraControl:true'
          ]) if(!patched.includes(needle)&&!runtime.includes(needle)) throw new Error(`Missing hybrid runtime invariant: ${needle}`);
          console.log('Hybrid HPS7 state-machine invariants: PASS');

          for(const needle of [
            'const LOW=770, HIGH=1336',
            'async function prepareSender()',
            'async function preflightFrontCamera()',
            'async function signalReady',
            'async function waitReady',
            'micSource.connect(analyser)',
            'analyser.connect(silentGain)',
            'silentGain.connect(micCtx.destination)',
            "facingMode:{ideal:'user'}"
          ]) if(!hybrid.includes(needle)) throw new Error(`Missing hybrid-control invariant: ${needle}`);
          if(hybrid.includes('compressMissing')||hybrid.includes('makePacket('))throw new Error('Hybrid audio must not carry NACK payloads');
          console.log('READY-only audio control invariants: PASS');

          const gp=html.indexOf('runtime-syntax-guard.js?v=096'),hp=html.indexOf('hybrid-control.js?v=096'),rp=html.indexOf('hps7-runtime.js?v=096');
          if(gp<0||hp<0||rp<0||!(gp<hp&&hp<rp))throw new Error('load order must be guard -> hybrid -> runtime');
          for(const asset of ['runtime-syntax-guard.js?v=096','hybrid-control.js?v=096','hps7-runtime.js?v=096','color-warmup.js?v=096','transfer-telemetry.js?v=096'])if(!sw.includes(asset))throw new Error(`SW missing ${asset}`);
          if(!sw.includes('hopperlink-pixelstream-v096'))throw new Error('cache key not v096');
          if(!html.includes('MVP v0.9.6 · Auto Hybrid Control'))throw new Error('UI badge not v0.9.6');
          console.log('v0.9.6 load order + cache isolation: PASS');
          NODE
