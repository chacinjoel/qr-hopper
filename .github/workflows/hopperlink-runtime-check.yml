name: HopperLink Runtime Check

on:
  push:
    paths:
      - 'hopperlink-pixelstream/**'
      - '.github/workflows/hopperlink-runtime-check.yml'
  workflow_dispatch:

jobs:
  syntax-and-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          set -e
          for f in hopperlink-pixelstream/*.js; do node --check "$f"; done

      - name: Validate HPS7 + HPS8 PhotonFountain v0.10.0
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm'),{webcrypto}=require('crypto'),{performance}=require('perf_hooks');
          const p='hopperlink-pixelstream',read=n=>fs.readFileSync(`${p}/${n}`,'utf8');
          const manual=read('hps7-manual-max.js'),dual=read('hps7-duallane-v2.js'),repair=read('repair-reacquisition.js'),core=read('hps7.js'),guard=read('runtime-syntax-guard.js'),dock=read('optical-dock-v3.js'),html=read('index.html'),styles=read('styles.css'),sw=read('sw.js'),fountain=read('hps8-fountain.js'),sonic=read('hps8-sonic.js'),hps8=read('hps8.js');
          class CE{constructor(type,init={}){this.type=type;this.detail=init.detail}}
          function extract(src,start,name){const a=src.indexOf(start),b=src.indexOf('\nfunction loadScript',a);if(a<0||b<=a)throw Error(`${name} extraction failed`);const c={console};vm.createContext(c);vm.runInContext(src.slice(a,b)+`\n;globalThis.__fn=${name};`,c);return c.__fn;}
          function repairPatch(src){const a=src.indexOf('function patchManualRuntimeSource'),b=src.indexOf('\nwindow.fetch=async function',a),c={console};if(a<0||b<=a)throw Error('repair patch extraction failed');vm.createContext(c);vm.runInContext(src.slice(a,b)+'\n;globalThis.__p=patchManualRuntimeSource;',c);return c.__p;}

          (async()=>{
            // HPS7 still builds exactly as the fallback path and keeps Adaptive Vision injection.
            const patched=extract(dual,'function replaceOne','patchDual')(extract(repairPatch(repair)(manual),'function replaceOne','patchCore')(core));
            let rawErr=null;try{new Function(patched)}catch(e){rawErr=e}
            const events=[],g={Function,dispatchEvent:e=>events.push(e)};const gc={globalThis:g,CustomEvent:CE,console,Object};vm.createContext(gc);vm.runInContext(guard,gc);const compiled=g.Function(`${patched}\n//# sourceURL=hps7-core-v1000.js`);if(typeof compiled!=='function')throw Error('HPS7 generated core compile failed');if(g.Function!==Function)throw Error('HPS7 Function guard did not restore native Function');const ge=events.find(e=>e.type==='hopper:runtime-syntax-fixed');if(!ge)throw Error('HPS7 guard did not report');if(rawErr&&!ge.detail?.syntaxFixed)throw Error('HPS7 legacy syntax repair missing');if(!ge.detail?.normalizerInjected)throw Error('HPS7 lane normalizer injection missing');
            for(const s of ['repairPassGroups','repairOrderName','finishRepairRequested','physicalBps'])if(!patched.includes(s))throw Error(`HPS7 runtime missing ${s}`);
            console.log('HPS7 fallback generated core: PASS');

            // PhotonFountain codec: remove 25% of systematic blocks, then recover only from fountain symbols.
            const fc={console,window:null};fc.window=fc;vm.createContext(fc);vm.runInContext(fountain,fc,{timeout:1500});const F=fc.__hopperHPS8Fountain;if(!F)throw Error('PhotonFountain export missing');
            const N=80,SZ=96,blocks=Array.from({length:N},(_,i)=>{const b=new Uint8Array(SZ);for(let j=0;j<SZ;j++)b[j]=(i*37+j*13+(j>>2))&255;return b;});const dec=F.createDecoder(N,SZ);for(let i=0;i<N;i++)if(i%4!==0)dec.addSystematic(i,blocks[i]);for(let seed=1;seed<20000&&!dec.complete;seed++){const sym=F.makeParity(blocks,seed);dec.addParity(seed,sym.data);}if(!dec.complete)throw Error(`PhotonFountain failed to recover ${dec.snapshot().missing} blocks`);const rebuilt=dec.blocks();for(let i=0;i<N;i++)for(let j=0;j<SZ;j++)if(rebuilt[i][j]!==blocks[i][j])throw Error(`PhotonFountain mismatch block ${i}`);
            const missing=[1,7,18,29,55,79],bloom=F.makeBloom(missing,16,3),candidates=F.candidatesFromBloom(N,bloom,3);for(const i of missing)if(!candidates.includes(i))throw Error(`Bloom-NACK false negative ${i}`);if(candidates.length>=N)throw Error('Bloom-NACK degenerated to full retransmission');
            console.log(`PhotonFountain loss recovery: PASS · 25% systematic missing · Bloom ${missing.length}→${candidates.length} candidates`);

            // Sonic8 packet framing/CRC at byte/symbol level (audio hardware is physical-test only).
            const sc={console,window:null,document:{getElementById(){return null}},navigator:{mediaDevices:{}},CustomEvent:CE,setInterval,clearInterval,performance};sc.window=sc;sc.dispatchEvent=()=>true;vm.createContext(sc);vm.runInContext(sonic,sc,{timeout:1500});const S=sc.__hopperHPS8Sonic;if(!S)throw Error('Sonic8 export missing');const payload=S.progressPayload(734,21,1),packet=S.pack(S.type.PROGRESS,0x1234abcd,payload),symbols=S.bytesToSymbols(packet),bytes=S.symbolsToBytes(symbols),parsed=S.unpack(bytes);if(!parsed?.ok||parsed.session!==0x1234abcd||parsed.type!==S.type.PROGRESS)throw Error('Sonic8 packet roundtrip failed');const prog=S.parseProgress(parsed.payload);if(prog.permille!==734||prog.missing!==21||prog.flags!==1)throw Error('Sonic8 progress payload failed');if(!S.nearUltrasonic||Math.min(...S.frequencies)<17500)throw Error('Sonic8 is not near-ultrasonic');
            console.log('Sonic8 framing + CRC + progress roundtrip: PASS');

            // Static HPS8 architecture invariants.
            for(const s of ['PhotonFountain','sonicAutoRepair:true','bloomNack:true','fileProgress:true','Lane A','SYSTEMATIC','FOUNTAIN','Bloom-NACK'])if(!hps8.includes(s))throw Error(`HPS8 runtime missing ${s}`);
            for(const s of ['fitAffine','phaseCheck','normalizeSamples','adaptiveExposure:true','phaseBeacons:true'])if(!dock.includes(s))throw Error(`Optical Dock v3 missing ${s}`);
            for(const s of ['id="protocolMode"','value="hps7"','value="hps8" selected','hps8ProgressPanel','hps8Percent','hps8FileBar','hps8AutoRepair','HPS8 PhotonFountain'])if(!html.includes(s))throw Error(`HTML HPS8 missing ${s}`);
            for(const s of ['.protocolPicker','.hps8ProgressPanel','.hps8ProgressTop','.hps8RepairLine'])if(!styles.includes(s))throw Error(`HPS8 CSS missing ${s}`);
            const order=['runtime-syntax-guard.js?v=1000','optical-dock-v3.js?v=1000','hps7-duallane-v2.js?v=1000','runtime-stability.js?v=1000','hps8-fountain.js?v=1000','hps8-sonic.js?v=1000','hps8.js?v=1000'];let prev=-1;for(const s of order){const i=html.indexOf(s);if(i<0||i<=prev)throw Error(`load order ${s}`);prev=i}
            for(const s of ['hps8-fountain.js?v=1000','hps8-sonic.js?v=1000','hps8.js?v=1000','optical-dock-v3.js?v=1000'])if(!sw.includes(s))throw Error(`SW missing ${s}`);if(!sw.includes('hopperlink-pixelstream-v1000'))throw Error('SW cache key is not v1000');

            // Real HPS8 Prepare smoke with an in-memory file.
            class ClassList{constructor(){this.s=new Set()}add(...x){x.forEach(v=>this.s.add(v))}remove(...x){x.forEach(v=>this.s.delete(v))}contains(x){return this.s.has(x)}toggle(x,on){if(on===undefined)on=!this.s.has(x);on?this.s.add(x):this.s.delete(x);return on}}
            const mk=id=>({id,textContent:'',className:'',disabled:false,value:'',style:{display:''},classList:new ClassList(),files:[],srcObject:null,onclick:null,onchange:null,selectedOptions:[{textContent:''}],addEventListener(){},scrollIntoView(){}});
            const ids=['protocolMode','prepareBtn','sendBtn','txRepairBtn','cameraBtn','stopCameraBtn','overlayActionBtn','closeStream','gridSize','speedMode','modulationMode','streamShape','speedHint','modulationHint','layoutHint','throughputHint','capacity','cameraChip','wakeChip','phaseStatus','sendLog','rxLog','streamOverlay','streamMeta','streamBottom','video','capture','pixelCanvas','receiverPanel','fileInput','fileSize','frameCount','hps8ProgressPanel','hps8SonicStatus','hps8FileName','hps8Percent','hps8Bytes','hps8FileBar','hps8Speed','hps8Eta','hps8Fountain','hps8ProgressStatus','hps8AutoRepair'];
            const els=Object.fromEntries(ids.map(id=>[id,mk(id)]));els.protocolMode.value='hps8';els.gridSize.value='56';els.streamShape.value='tall2';els.modulationMode.value='gray2';els.speedMode.value='maxcal';els.sendBtn.disabled=true;els.sendBtn.style.display='none';els.txRepairBtn.style.display='none';els.streamOverlay.style.display='none';els.stopCameraBtn.disabled=true;
            const testBytes=new Uint8Array(1024*1024+321);for(let i=0;i<testBytes.length;i+=997)testBytes[i]=(i*11)&255;els.fileInput.files=[{name:'hps8-prepare-smoke.bin',type:'application/octet-stream',size:testBytes.length,lastModified:Date.now(),arrayBuffer:async()=>testBytes.buffer.slice(0)}];
            const hc={console,document:{readyState:'complete',body:{style:{}},documentElement:{classList:new ClassList()},getElementById:id=>els[id]||null},navigator:{mediaDevices:{}},TextEncoder,TextDecoder,crypto:webcrypto,performance,CustomEvent:CE,Blob,URL:{createObjectURL:()=>''},alert:()=>{},confirm:()=>true,requestAnimationFrame:cb=>setTimeout(()=>cb(performance.now()),0),setTimeout:()=>0,clearTimeout};hc.window=hc;hc.globalThis=hc;hc.addEventListener=()=>{};hc.dispatchEvent=()=>true;hc.__hopperHPS8Fountain=F;hc.__hopperHPS8Sonic={type:S.type,stopListener(){},startListener:async()=>true,ensureOutput:async()=>true,send:async()=>true,progressPayload:S.progressPayload,parseProgress:S.parseProgress,bloomPayload:S.bloomPayload,parseBloom:S.parseBloom,completePayload:S.completePayload,parseComplete:S.parseComplete};vm.createContext(hc);vm.runInContext(hps8,hc,{timeout:2000});if(!hc.__hopperHPS8)throw Error('HPS8 runtime export missing');await hc.__hopperHPS8.prepare();const total=Number(els.frameCount.textContent);if(!Number.isFinite(total)||total<1000)throw Error(`HPS8 Prepare invalid source count ${els.frameCount.textContent}`);if(els.sendBtn.disabled||els.sendBtn.style.display==='none')throw Error('HPS8 Prepare did not enable HELLO');if(!els.capacity.textContent.includes('700 B'))throw Error('HPS8 source chunk size not reflected in UI');
            console.log(`Real HPS8 Prepare: PASS · ${total} source blocks · HELLO enabled`);
            console.log('HPS7 + HPS8 v0.10.0 coexistence invariants: PASS');
          })().catch(e=>{console.error(e);process.exitCode=1;});
          NODE
