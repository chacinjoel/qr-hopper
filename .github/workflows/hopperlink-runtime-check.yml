name: HopperLink Runtime Check

on:
  push:
    paths:
      - 'hopperlink-pixelstream/**'
      - '.github/workflows/hopperlink-runtime-check.yml'
  workflow_dispatch:

jobs:
  syntax-and-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          set -e
          for f in hopperlink-pixelstream/*.js; do node --check "$f"; done

      - name: Validate HPS7 + HPS8 Sonic Adaptive v0.10.2
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm'),{webcrypto}=require('crypto'),{performance}=require('perf_hooks');
          const p='hopperlink-pixelstream',read=n=>fs.readFileSync(`${p}/${n}`,'utf8');
          const manual=read('hps7-manual-max.js'),dual=read('hps7-duallane-v2.js'),repair=read('repair-reacquisition.js'),core=read('hps7.js'),guard=read('runtime-syntax-guard.js'),dock=read('optical-dock-v3.js'),html=read('index.html'),styles=read('styles.css'),sw=read('sw.js'),fountain=read('hps8-fountain.js'),sonic=read('hps8-sonic-adaptive.js'),diag=read('hps8-diagnostics.js'),hps8=read('hps8.js');
          class CE{constructor(type,init={}){this.type=type;this.detail=init.detail}}
          function extract(src,start,name){const a=src.indexOf(start),b=src.indexOf('\nfunction loadScript',a);if(a<0||b<=a)throw Error(`${name} extraction failed`);const c={console};vm.createContext(c);vm.runInContext(src.slice(a,b)+`\n;globalThis.__fn=${name};`,c);return c.__fn;}
          function repairPatch(src){const a=src.indexOf('function patchManualRuntimeSource'),b=src.indexOf('\nwindow.fetch=async function',a),c={console};if(a<0||b<=a)throw Error('repair patch extraction failed');vm.createContext(c);vm.runInContext(src.slice(a,b)+'\n;globalThis.__p=patchManualRuntimeSource;',c);return c.__p;}

          (async()=>{
            const patched=extract(dual,'function replaceOne','patchDual')(extract(repairPatch(repair)(manual),'function replaceOne','patchCore')(core));
            let rawErr=null;try{new Function(patched)}catch(e){rawErr=e}
            const events=[],g={Function,dispatchEvent:e=>events.push(e)};const gc={globalThis:g,CustomEvent:CE,console,Object};vm.createContext(gc);vm.runInContext(guard,gc);const compiled=g.Function(`${patched}\n//# sourceURL=hps7-core-v1002.js`);if(typeof compiled!=='function')throw Error('HPS7 generated core compile failed');if(g.Function!==Function)throw Error('HPS7 Function guard did not restore native Function');const ge=events.find(e=>e.type==='hopper:runtime-syntax-fixed');if(!ge)throw Error('HPS7 guard did not report');if(rawErr&&!ge.detail?.syntaxFixed)throw Error('HPS7 legacy syntax repair missing');if(!ge.detail?.normalizerInjected)throw Error('HPS7 lane normalizer injection missing');
            console.log('HPS7 fallback generated core: PASS');

            const fc={console,window:null};fc.window=fc;vm.createContext(fc);vm.runInContext(fountain,fc,{timeout:1500});const F=fc.__hopperHPS8Fountain;if(!F)throw Error('PhotonFountain export missing');
            const N=80,SZ=96,blocks=Array.from({length:N},(_,i)=>{const b=new Uint8Array(SZ);for(let j=0;j<SZ;j++)b[j]=(i*37+j*13+(j>>2))&255;return b;});const dec=F.createDecoder(N,SZ);for(let i=0;i<N;i++)if(i%4!==0)dec.addSystematic(i,blocks[i]);for(let seed=1;seed<20000&&!dec.complete;seed++){const sym=F.makeParity(blocks,seed);dec.addParity(seed,sym.data);}if(!dec.complete)throw Error(`PhotonFountain failed to recover ${dec.snapshot().missing} blocks`);const rebuilt=dec.blocks();for(let i=0;i<N;i++)for(let j=0;j<SZ;j++)if(rebuilt[i][j]!==blocks[i][j])throw Error(`PhotonFountain mismatch block ${i}`);
            console.log('PhotonFountain 25% systematic loss recovery: PASS');

            const sc={console,window:null,document:{getElementById(){return null},createElement(){return{style:{},dataset:{}}}},navigator:{mediaDevices:{}},CustomEvent:CE,setInterval,clearInterval,performance};sc.window=sc;sc.dispatchEvent=()=>true;vm.createContext(sc);vm.runInContext(sonic,sc,{timeout:1500});const S=sc.__hopperHPS8Sonic;if(!S)throw Error('Adaptive Sonic8 export missing');
            const payload=S.progressPayload(734,21,1),packet=S.pack(S.type.PROGRESS,0x1234abcd,payload),symbols=S.bytesToSymbols(packet),bytes=S.symbolsToBytes(symbols),parsed=S.unpack(bytes);if(!parsed?.ok||parsed.session!==0x1234abcd||parsed.type!==S.type.PROGRESS)throw Error('Sonic8 packet roundtrip failed');
            if(!S.adaptiveBands||!S.guardedSymbols)throw Error('Adaptive/guarded Sonic flags missing');
            for(const k of ['high','mid','safe'])if(!S.profiles?.[k]?.freq||S.profiles[k].freq.length!==4)throw Error(`Sonic profile ${k} invalid`);
            if(Math.min(...S.profiles.high.freq)<17000||Math.max(...S.profiles.mid.freq)>16000||Math.max(...S.profiles.safe.freq)>13500)throw Error('Sonic band plan regression');
            if(S.timing.fftSize!==512||S.timing.toneMs<20||S.timing.gapMs<20)throw Error('Sonic guarded timing regression');
            const repeatSymbols=[0,0,1,1,1,2,0,0],schedule=S.symbolSchedule(repeatSymbols);if(schedule.length!==repeatSymbols.length||schedule.some((x,i)=>x.sym!==repeatSymbols[i]||x.gapMs<20))throw Error('consecutive-symbol guard invariant failed');
            console.log(`Sonic8 adaptive bands + guarded symbols: PASS · FFT ${S.timing.fftSize} · ${S.timing.toneMs}/${S.timing.gapMs} ms`);

            const ds={console,window:null,document:{readyState:'loading',getElementById(){return null},addEventListener(){}},MutationObserver:class{observe(){}},setInterval:()=>0,setTimeout:()=>0,clearTimeout:()=>{},performance,crypto:webcrypto,CustomEvent:CE};ds.window=ds;ds.addEventListener=()=>{};ds.dispatchEvent=()=>true;ds.__hopperHPS8Fountain={candidatesFromBloom:()=>[],makeBloom:()=>new Uint8Array(16)};ds.__hopperHPS8Sonic={type:{ACK:1,PROGRESS:2,BLOOM:3,COMPLETE:4},send:async()=>true,startListener:async()=>true,stopListener(){},parseBloom:()=>null,bloomPayload:(n,b)=>b};vm.createContext(ds);vm.runInContext(diag,ds,{timeout:1500});const D=ds.__hopperHPS8Diagnostics;if(!D)throw Error('HPS8 diagnostics export missing');const ex=D.encodeExact(3,[4,9,250]),dx=D.decodeExact(ex);if(dx.actualMissing!==3||JSON.stringify(Array.from(dx.ids))!==JSON.stringify([4,9,250]))throw Error('EXACT-NACK codec roundtrip failed');for(const s of ['adaptiveBands:true','guardedSymbols:true','AUTO-REPAIR E2E','99.9%','repeats:3'])if(!diag.includes(s))throw Error(`Diagnostics invariant missing ${s}`);
            console.log('Adaptive diagnostics + EXACT-NACK: PASS');

            for(const s of ['PhotonFountain','sonicAutoRepair:true','bloomNack:true','fileProgress:true'])if(!hps8.includes(s))throw Error(`HPS8 runtime missing ${s}`);
            for(const s of ['fitAffine','phaseCheck','normalizeSamples','adaptiveExposure:true','phaseBeacons:true'])if(!dock.includes(s))throw Error(`Optical Dock v3 missing ${s}`);
            for(const s of ['MVP v0.10.2 · Sonic8 Adaptive Multiband','sonicDiagBand','sonicDiagSignal','sonicDiagMic','Guarded Symbols'])if(!html.includes(s))throw Error(`HTML adaptive Sonic missing ${s}`);
            for(const s of ['.sonicDiagPanel','.sonicDiagGrid'])if(!styles.includes(s))throw Error(`Sonic diagnostic CSS missing ${s}`);
            const order=['runtime-syntax-guard.js?v=1002','optical-dock-v3.js?v=1002','hps7-duallane-v2.js?v=1002','runtime-stability.js?v=1002','hps8-fountain.js?v=1002','hps8-sonic-adaptive.js?v=1002','hps8-diagnostics.js?v=1002','hps8.js?v=1002'];let prev=-1;for(const s of order){const i=html.indexOf(s);if(i<0||i<=prev)throw Error(`load order ${s}`);prev=i}
            for(const s of ['hps8-fountain.js?v=1002','hps8-sonic-adaptive.js?v=1002','hps8-diagnostics.js?v=1002','hps8.js?v=1002'])if(!sw.includes(s))throw Error(`SW missing ${s}`);if(!sw.includes('hopperlink-pixelstream-v1002'))throw Error('SW cache key is not v1002');

            class ClassList{constructor(){this.s=new Set()}add(...x){x.forEach(v=>this.s.add(v))}remove(...x){x.forEach(v=>this.s.delete(v))}contains(x){return this.s.has(x)}toggle(x,on){if(on===undefined)on=!this.s.has(x);on?this.s.add(x):this.s.delete(x);return on}}
            const mk=id=>({id,textContent:'',className:'',disabled:false,value:'',style:{display:''},classList:new ClassList(),files:[],srcObject:null,onclick:null,onchange:null,selectedOptions:[{textContent:''}],addEventListener(){},scrollIntoView(){}});
            const ids=['protocolMode','prepareBtn','sendBtn','txRepairBtn','cameraBtn','stopCameraBtn','overlayActionBtn','closeStream','gridSize','speedMode','modulationMode','streamShape','speedHint','modulationHint','layoutHint','throughputHint','capacity','cameraChip','wakeChip','phaseStatus','sendLog','rxLog','streamOverlay','streamMeta','streamBottom','video','capture','pixelCanvas','receiverPanel','fileInput','fileSize','frameCount','hps8ProgressPanel','hps8SonicStatus','hps8FileName','hps8Percent','hps8Bytes','hps8FileBar','hps8Speed','hps8Eta','hps8Fountain','hps8ProgressStatus','hps8AutoRepair'];
            const els=Object.fromEntries(ids.map(id=>[id,mk(id)]));els.protocolMode.value='hps8';els.gridSize.value='56';els.streamShape.value='tall2';els.modulationMode.value='gray2';els.speedMode.value='maxcal';els.sendBtn.disabled=true;els.sendBtn.style.display='none';els.txRepairBtn.style.display='none';els.streamOverlay.style.display='none';els.stopCameraBtn.disabled=true;
            const testBytes=new Uint8Array(1024*1024+321);els.fileInput.files=[{name:'hps8-prepare-smoke.bin',type:'application/octet-stream',size:testBytes.length,lastModified:Date.now(),arrayBuffer:async()=>testBytes.buffer.slice(0)}];
            const hc={console,document:{readyState:'complete',body:{style:{}},documentElement:{classList:new ClassList()},getElementById:id=>els[id]||null},navigator:{mediaDevices:{}},TextEncoder,TextDecoder,crypto:webcrypto,performance,CustomEvent:CE,Blob,URL:{createObjectURL:()=>''},alert:()=>{},confirm:()=>true,requestAnimationFrame:cb=>setTimeout(()=>cb(performance.now()),0),setTimeout:()=>0,clearTimeout};hc.window=hc;hc.globalThis=hc;hc.addEventListener=()=>{};hc.dispatchEvent=()=>true;hc.__hopperHPS8Fountain=F;hc.__hopperHPS8Sonic={type:S.type,stopListener(){},startListener:async()=>true,ensureOutput:async()=>true,send:async()=>true,progressPayload:S.progressPayload,parseProgress:S.parseProgress,bloomPayload:S.bloomPayload,parseBloom:S.parseBloom,completePayload:S.completePayload,parseComplete:S.parseComplete};vm.createContext(hc);vm.runInContext(hps8,hc,{timeout:2000});if(!hc.__hopperHPS8)throw Error('HPS8 runtime export missing');await hc.__hopperHPS8.prepare();const total=Number(els.frameCount.textContent);if(!Number.isFinite(total)||total<1000||els.sendBtn.disabled)throw Error('HPS8 Prepare smoke failed');
            console.log(`Real HPS8 Prepare: PASS · ${total} source blocks`);
            console.log('HPS7 + HPS8 v0.10.2 Adaptive Sonic invariants: PASS');
          })().catch(e=>{console.error(e);process.exitCode=1;});
          NODE
