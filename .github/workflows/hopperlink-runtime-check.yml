name: HopperLink Runtime Check

on:
  push:
    paths:
      - 'hopperlink-pixelstream/**'
      - '.github/workflows/hopperlink-runtime-check.yml'
  workflow_dispatch:

jobs:
  syntax-and-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          set -e
          for f in hopperlink-pixelstream/*.js; do node --check "$f"; done

      - name: Validate v0.9.16 core, Optical Dock and real Prepare HPS7
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm'),{webcrypto}=require('crypto'),{performance}=require('perf_hooks');
          const p='hopperlink-pixelstream',read=n=>fs.readFileSync(`${p}/${n}`,'utf8');
          const manual=read('hps7-manual-max.js'),dual=read('hps7-duallane-v2.js'),repair=read('repair-reacquisition.js'),projection=read('hps7-projection.js'),premium=read('premium-flow-ui.js'),stability=read('runtime-stability.js'),telemetry=read('transfer-telemetry.js'),core=read('hps7.js'),guard=read('runtime-syntax-guard.js'),stage=read('binary-stage.css'),styles=read('styles.css'),html=read('index.html'),sw=read('sw.js'),dock=read('optical-dock-v2.js'),tagStatus=read('binary-tag-status.js');

          function extract(src,start,name){const a=src.indexOf(start),b=src.indexOf('\nfunction loadScript',a);if(a<0||b<=a)throw Error(`${name} extraction failed`);const c={console};vm.createContext(c);vm.runInContext(src.slice(a,b)+`\n;globalThis.__fn=${name};`,c);return c.__fn;}
          function repairPatch(src){const a=src.indexOf('function patchManualRuntimeSource'),b=src.indexOf('\nwindow.fetch=async function',a),c={console};if(a<0||b<=a)throw Error('repair patch extraction failed');vm.createContext(c);vm.runInContext(src.slice(a,b)+'\n;globalThis.__p=patchManualRuntimeSource;',c);return c.__p;}
          const patched=extract(dual,'function replaceOne','patchDual')(extract(repairPatch(repair)(manual),'function replaceOne','patchCore')(core));

          let rawErr=null;try{new Function(patched)}catch(e){rawErr=e}
          const events=[],g={Function,dispatchEvent:e=>events.push(e)};class CE{constructor(type,init={}){this.type=type;this.detail=init.detail}}
          const gc={globalThis:g,CustomEvent:CE,console,Object};vm.createContext(gc);vm.runInContext(guard,gc);const compiled=g.Function(`${patched}\n//# sourceURL=hps7-core-v0916.js`);if(typeof compiled!=='function')throw Error('generated core compile failed');if(g.Function!==Function)throw Error('Function not restored');if(rawErr&&!events.some(e=>e.type==='hopper:runtime-syntax-fixed'))throw Error('guard did not report repair');
          console.log('Generated HPS7 v0.9.16 core compile: PASS');

          for(const s of ['repairPassGroups','repairOrderName','finishRepairRequested','window.__hopperFinishRepairEarly','physicalBps','bloques/stream físico'])if(!patched.includes(s))throw Error(`runtime missing ${s}`);
          const cycles=n=>n>0?Math.max(1,Math.floor(1500/n)):1;for(const [n,w] of [[1,1500],[50,30],[290,5],[499,3],[500,3],[501,2],[1501,1]])if(cycles(n)!==w)throw Error(`repair ${n}`);
          const payload=b=>Math.floor((56*56-32)*b/8)-28,lane=b=>Math.max(1,Math.floor((payload(b)-1)/(367+6))),per=[2,3,4].map(b=>lane(b)*2),streams=per.map(n=>Math.ceil(4603/n));if(JSON.stringify(per)!=='[4,6,8]'||JSON.stringify(streams)!=='[1151,768,576]')throw Error('packing/projection');
          for(const s of ['dataSec=streams*sp.repeat/sp.fps','bps=perPhysical*BASE_CHUNK*sp.fps/sp.repeat'])if(!projection.includes(s))throw Error(`projection missing ${s}`);
          if(!premium.includes("attributeFilter:['disabled']")||premium.includes("attributeFilter:['disabled','style','class']"))throw Error('WebKit observer regression');
          for(const s of ['validateRuntime','wrapPrepare','__hopperPrepareBusy'])if(!stability.includes(s))throw Error(`stability missing ${s}`);
          if(repair.includes('TYPE.DATA')||repair.includes('makePacket('))throw Error('repair target generates DATA');

          for(const s of ['contourLock:true','temporalTracking:true','photometricRails:true','stableFrameGate:true','frameFreezeOnTransition:true','findContour','markersFromContour','lastStableImage','heldFrames'])if(!dock.includes(s))throw Error(`Optical Dock missing ${s}`);
          for(const s of ['.dockAnchor','.photoRail','rail-top','rail-bottom','Optical Dock v2'])if(!stage.includes(s))throw Error(`Dock CSS missing ${s}`);
          if(tagStatus.includes('repair-reacquisition.js')||tagStatus.includes('loadRepairReacquisition'))throw Error('binary-tag-status reintroduced legacy Repair autoload');
          if(!tagStatus.includes('legacyRepairAutoload:false'))throw Error('tag status lacks legacy-loader invariant');

          const order=['runtime-syntax-guard.js?v=0916','binary-tag-bridge-fast.js?v=0916','optical-dock-v2.js?v=0916','binary-tag-status.js?v=0916','premium-flow-ui.js?v=0916','hps7-projection.js?v=0916','repair-reacquisition.js?v=0916','hps7-duallane-v2.js?v=0916','runtime-stability.js?v=0916'];let prev=-1;for(const s of order){const i=html.indexOf(s);if(i<0||i<=prev)throw Error(`load order ${s}`);prev=i}
          for(const s of ['MVP v0.9.16 · Optical Dock v2','Contour Lock','Photometric Rails','Stable Frame Gate'])if(!html.includes(s))throw Error(`HTML missing ${s}`);
          for(const s of ['optical-dock-v2.js?v=0916','hps7-duallane-v2.js?v=0916','binary-stage.css?v=0916'])if(!sw.includes(s))throw Error(`SW missing ${s}`);if(!sw.includes('hopperlink-pixelstream-v0916'))throw Error('cache key not v0916');

          // Pure synthetic contour test: white scene + thick black 1:2 frame, no tags.
          class FakeCtx{};FakeCtx.prototype.getImageData=function(){return null};
          const dockDoc={readyState:'loading',addEventListener(){},getElementById(){return null},querySelector(){return null},querySelectorAll(){return[]},createElement(){return{}},documentElement:{classList:{}}};
          const dc={console,performance,CanvasRenderingContext2D:FakeCtx,document:dockDoc,setInterval:()=>0,CustomEvent:CE};dc.window=dc;dc.addEventListener=()=>{};vm.createContext(dc);vm.runInContext(dock,dc,{timeout:1500,filename:'optical-dock-v2-test.js'});
          const W=400,H=700,data=new Uint8ClampedArray(W*H*4);for(let p=0;p<data.length;p+=4){data[p]=235;data[p+1]=235;data[p+2]=235;data[p+3]=255}
          const x0=100,x1=300,y0=75,y1=625,t=14;for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){if(x<x0+t||x>x1-t||y<y0+t||y>y1-t){const p=(y*W+x)*4;data[p]=8;data[p+1]=8;data[p+2]=8}}
          const contour=dc.__hopperOpticalDockV2.findContour({data},W,H);if(!contour)throw Error('Optical Dock failed synthetic contour without tags');const cm=dc.__hopperOpticalDockV2.markersFromContour(contour);if(!cm||!(cm.tl.x<cm.tr.x&&cm.tl.y<cm.bl.y))throw Error('Contour marker reconstruction failed');
          console.log('Optical Dock synthetic contour without tags: PASS');

          // Execute real Prepare HPS7 handler with an in-memory file.
          class ClassList{constructor(){this.s=new Set()}add(...x){x.forEach(v=>this.s.add(v))}remove(...x){x.forEach(v=>this.s.delete(v))}contains(x){return this.s.has(x)}toggle(x,on){if(on===undefined)on=!this.s.has(x);on?this.s.add(x):this.s.delete(x);return on}}
          const mk=id=>({id,textContent:'',className:'',disabled:false,value:'',style:{display:''},classList:new ClassList(),files:[],srcObject:null,onclick:null,onchange:null,selectedOptions:[{textContent:''}],addEventListener(){},scrollIntoView(){}});
          const ids=['prepareBtn','sendBtn','txRepairBtn','cameraBtn','stopCameraBtn','overlayActionBtn','closeStream','gridSize','speedMode','modulationMode','streamShape','speedHint','modulationHint','layoutHint','throughputHint','capacity','cameraChip','wakeChip','phaseStatus','sendLog','rxLog','streamOverlay','streamMeta','streamBottom','video','receiverPanel','capture','pixelCanvas','rxFrames','rxTotal','rxMissing','rxBar','receivedBox','rxErrors','rxElapsed','rxRate','rxEta','guideCanvas','lockQuality','fileInput','fileSize','frameCount'];
          const els=Object.fromEntries(ids.map(id=>[id,mk(id)]));els.sendBtn.disabled=true;els.sendBtn.style.display='none';els.txRepairBtn.style.display='none';els.streamOverlay.style.display='none';els.gridSize.value='56';els.speedMode.value='maxcal';els.modulationMode.value='gray2';els.streamShape.value='tall2';els.stopCameraBtn.disabled=true;
          const testBytes=new Uint8Array(1024*1024+321);els.fileInput.files=[{name:'prepare-smoke.bin',type:'application/octet-stream',size:testBytes.length,lastModified:Date.now(),arrayBuffer:async()=>testBytes.buffer.slice(0)}];const listeners={};
          const doc={readyState:'complete',body:{style:{}},documentElement:{classList:new ClassList()},getElementById:id=>els[id]||null,querySelectorAll:()=>[],createElement:tag=>mk(tag),head:{appendChild(){}}};const ctxSetTimeout=(fn,ms,...args)=>ms>5000?0:setTimeout(fn,ms,...args);
          const ctx={console,document:doc,navigator:{mediaDevices:{getUserMedia:async()=>{throw Error('camera not used')}}},location:{protocol:'file:'},TextEncoder,TextDecoder,crypto:webcrypto,performance,CustomEvent:CE,MutationObserver:class{observe(){}},alert:()=>{},confirm:()=>true,setTimeout:ctxSetTimeout,clearTimeout,setInterval:()=>0,clearInterval:()=>{},requestAnimationFrame:cb=>setTimeout(()=>cb(performance.now()),0)};ctx.window=ctx;ctx.globalThis=ctx;ctx.addEventListener=(type,fn)=>(listeners[type]||(listeners[type]=[])).push(fn);ctx.dispatchEvent=e=>{for(const fn of listeners[e.type]||[])fn(e);return true};vm.createContext(ctx);
          const bad="else showNack(p.round,suggest);}}}\nfunction controlPayloadNack",good="else showNack(p.round,suggest);}}\nfunction controlPayloadNack",runnable=patched.includes(bad)?patched.replace(bad,good):patched;vm.runInContext(runnable,ctx,{timeout:2500});ctx.__hopperRuntime={version:'0.9.16-smoke'};vm.runInContext(stability,ctx,{timeout:1000});ctx.dispatchEvent(new CE('hopper:runtime-ready',{detail:ctx.__hopperRuntime}));if(els.prepareBtn.disabled)throw Error('Prepare remained disabled');
          Promise.race([els.prepareBtn.onclick(),new Promise((_,rej)=>setTimeout(()=>rej(Error('Prepare HPS7 timed out')),3500))]).then(()=>{const total=Number(els.frameCount.textContent);if(!Number.isFinite(total)||total<1000||els.sendBtn.disabled)throw Error('Prepare failed smoke');if(ctx.__hopperPrepareBusy)throw Error('prepare busy not cleared');console.log(`Real Prepare HPS7: PASS · ${total} blocks · HELLO enabled`);console.log('v0.9.16 Optical Dock v2 invariants: PASS');}).catch(e=>{console.error(e);process.exitCode=1});
          NODE
