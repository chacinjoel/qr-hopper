name: HopperLink Runtime Check

on:
  push:
    paths:
      - 'hopperlink-pixelstream/**'
      - '.github/workflows/hopperlink-runtime-check.yml'
  workflow_dispatch:

jobs:
  syntax-and-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          set -e
          for f in hopperlink-pixelstream/*.js; do node --check "$f"; done

      - name: Validate HPS7 + HPS8 Sonic Edge RX v0.10.16
        run: |
          node <<'NODE'
          (async()=>{
          const fs=require('fs'),vm=require('vm'),{webcrypto}=require('crypto');
          const p='hopperlink-pixelstream',read=n=>fs.readFileSync(`${p}/${n}`,'utf8');
          const core=read('hps7.js'),manual=read('hps7-manual-max.js'),dual=read('hps7-duallane-v2.js'),guard=read('runtime-syntax-guard.js');
          const sonic=read('hps8-sonic-adaptive.js'),edge=read('hps8-sonic-slot-decoder.js'),geom=read('hps8-data-geometry.js'),strict=read('hps8-strict-ack.js'),diag=read('hps8-diagnostics.js'),hps8=read('hps8.js'),sw=read('sw.js');

          if(!core.includes('const DATA_MIN = .12, DATA_MAX = .88;'))throw Error('HPS7 DATA region changed');
          if(!core.includes('const DATA_GRIDS = [56,64,72];'))throw Error('HPS7 grids changed');
          function extract(text,name){const a=text.indexOf('function replaceOne'),b=text.indexOf('\nfunction loadScript',a);if(a<0||b<=a)throw Error(`Cannot extract ${name}`);return new Function(`${text.slice(a,b)}; return ${name};`)();}
          const generated=extract(dual,'patchDual')(extract(manual,'patchCore')(core));
          class CE{constructor(type,init={}){this.type=type;this.detail=init.detail}}
          let guardEvent=null;const gc={console,CustomEvent:CE,dispatchEvent:e=>{if(e.type==='hopper:runtime-syntax-fixed')guardEvent=e.detail;},window:null};gc.window=gc;vm.createContext(gc);vm.runInContext(guard,gc);const compiled=gc.Function(`${generated}\n//# sourceURL=hps7-core-v-ci.js`),body=compiled.toString();
          if(!guardEvent?.precisionScannerInjected||!guardEvent?.normalizerInjected||!body.includes('TRACK HOLD'))throw Error('HPS7 Precision regression');
          console.log('HPS7 Precision fallback: PASS');

          for(const s of ["VERSION='0.10.4'",'clockedBfsk:true','hammingFec:true','persistentDuplex:true'])if(!sonic.includes(s))throw Error(`Base Sonic missing ${s}`);
          for(const s of ["VERSION='0.10.16'",'edgeDecoder:true','transitionClock:true','TONE_HOLD=2.5','CLOCK_TICK','EDGE_BIT','NEXT_CLOCK','HEADER_OK','CRC_OK'])if(!edge.includes(s))throw Error(`Sonic Edge RX missing ${s}`);
          if(edge.includes('startEnd=onsetAt+START_MS')||edge.includes('PLL_ADJUST'))throw Error('Edge RX regressed to timeline/PLL timing');
          console.log('HPS8 Sonic Edge transition decoder: PASS');

          const doc={readyState:'loading',addEventListener(){},getElementById(){return null},querySelector(){return null}};
          const sc={console,window:null,document:doc,navigator:{mediaDevices:{}},CustomEvent:CE,setInterval:()=>0,clearInterval(){},performance,TextEncoder,Uint8Array,crypto:webcrypto,globalThis:null};sc.window=sc;sc.globalThis=sc;sc.dispatchEvent=()=>true;vm.createContext(sc);vm.runInContext(sonic,sc,{timeout:1500});vm.runInContext(edge,sc,{timeout:1500});const S=sc.__hopperHPS8Sonic;
          if(!S?.edgeDecoder||!S.transitionClock||S.version!=='0.10.16')throw Error('Edge decoder did not replace Sonic RX API');
          const captured=Uint8Array.from([83,56,1,1,238,64,95,80,10,168,1,73,9,76,140,24,70,94,89,155]);
          const cap=S.unpack(captured);if(!cap?.ok||cap.type!==S.type.ACK||cap.payload.length!==10)throw Error('Physical ACK capture no longer decodes');
          const sync=S.syncBits;if(!Array.isArray(sync)||sync.join('')!=='1011010011100101')throw Error('Sonic sync changed unexpectedly');
          console.log('Physical video ACK bytes + CRC: PASS · clean packet confirmed');

          for(const s of ['opticalProofRequired:true','fullCrcRequired:true','headerOnlyRejected:true','startLockCannotStartData:true'])if(!strict.includes(s))throw Error(`Optical Proof gate missing ${s}`);
          if(!hps8.includes('if(!tx||msg.session!==tx.session)return;'))throw Error('HPS8 session gate missing');
          if(!hps8.includes('if(msg.type===T.ACK)'))throw Error('HPS8 ACK handler missing');
          for(const s of ['sonicDiagClock','sonicDiagSync','sonicDiagFrame','sonicDiagFec','sonicDiagCrc'])if(!diag.includes(s))throw Error(`Diagnostics missing ${s}`);
          console.log('Optical Proof ACK + exact session gate: PASS');

          for(const s of ['opticalDockPriority:true','sameFrameBridge:true','hps8DualGeometry:true','DATA GEOM 1:2'])if(!geom.includes(s))throw Error(`HPS8 Data Geometry bridge missing ${s}`);
          if(!hps8.includes('function renderDual(rawA,rawB)')||!hps8.includes("const lanes=rx.session?[0,1]:[-1]"))throw Error('HPS8 DualLane path regression');
          console.log('HPS8 Data Geometry Prelock/DualLane: PASS');

          if(!sw.includes("hopperlink-pixelstream-v1016")||!sw.includes('hps8-sonic-slot-decoder.js?v=1015')||!sw.includes('hps8-data-geometry.js?v=1015'))throw Error('SW v1016 cache invalid');
          console.log('HPS7 + HPS8 v0.10.16 Sonic Edge RX integration: PASS');
          })().catch(e=>{console.error(e);process.exit(1);});
          NODE