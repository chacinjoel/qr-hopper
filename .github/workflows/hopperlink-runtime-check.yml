name: HopperLink Runtime Check

on:
  push:
    paths:
      - 'hopperlink-pixelstream/**'
      - '.github/workflows/hopperlink-runtime-check.yml'
  workflow_dispatch:

jobs:
  syntax-and-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          set -e
          for f in hopperlink-pixelstream/*.js; do echo "Checking $f"; node --check "$f"; done
      - name: Validate v0.9.14 Premium Flow
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const p='hopperlink-pixelstream';
          const manual=fs.readFileSync(`${p}/hps7-manual-max.js`,'utf8');
          const dual=fs.readFileSync(`${p}/hps7-duallane-v2.js`,'utf8');
          const repair=fs.readFileSync(`${p}/repair-reacquisition.js`,'utf8');
          const projection=fs.readFileSync(`${p}/hps7-projection.js`,'utf8');
          const premium=fs.readFileSync(`${p}/premium-flow-ui.js`,'utf8');
          const telemetry=fs.readFileSync(`${p}/transfer-telemetry.js`,'utf8');
          const core=fs.readFileSync(`${p}/hps7.js`,'utf8');
          const guard=fs.readFileSync(`${p}/runtime-syntax-guard.js`,'utf8');
          const bridge=fs.readFileSync(`${p}/binary-tag-bridge-fast.js`,'utf8');
          const warmup=fs.readFileSync(`${p}/color-warmup.js`,'utf8');
          const stageCss=fs.readFileSync(`${p}/binary-stage.css`,'utf8');
          const styles=fs.readFileSync(`${p}/styles.css`,'utf8');
          const html=fs.readFileSync(`${p}/index.html`,'utf8');
          const sw=fs.readFileSync(`${p}/sw.js`,'utf8');

          function extract(src,start,name){const a=src.indexOf(start),b=src.indexOf('\nfunction loadScript',a);if(a<0||b<=a)throw new Error(`${name} extraction failed`);const c={console};vm.createContext(c);vm.runInContext(src.slice(a,b)+`\n;globalThis.__fn=${name};`,c,{filename:`${name}.js`});return c.__fn;}
          function extractRepairPolicy(src){const a=src.indexOf('function patchManualRuntimeSource'),b=src.indexOf('\nwindow.fetch=async function',a);if(a<0||b<=a)throw new Error('repair policy extraction failed');const c={console};vm.createContext(c);vm.runInContext(src.slice(a,b)+'\n;globalThis.__patch=patchManualRuntimeSource;',c);return c.__patch;}
          const patchedManual=extractRepairPolicy(repair)(manual);
          const patched=extract(dual,'function replaceOne','patchDual')(extract(patchedManual,'function replaceOne','patchCore')(core));
          let rawErr=null;try{new Function(patched);}catch(e){rawErr=e;}
          const events=[],g={Function,dispatchEvent:e=>events.push(e)};class CE{constructor(type,init={}){this.type=type;this.detail=init.detail;}}const gc={globalThis:g,CustomEvent:CE,console,Object};vm.createContext(gc);vm.runInContext(guard,gc);const compiled=g.Function(`${patched}\n//# sourceURL=hps7-core-v0914-premium.js`);if(typeof compiled!=='function')throw new Error('premium generated core did not compile');if(g.Function!==Function)throw new Error('native Function not restored');if(rawErr&&!events.some(e=>e.type==='hopper:runtime-syntax-fixed'))throw new Error('syntax guard did not fire');
          console.log('Generated HPS7 v0.9.14 compile: PASS');

          for(const n of ['const BASE_CHUNK = 367;','Math.max(1,Math.floor(1500/n))','repairPassGroups','repairOrderName','finishRepairRequested','window.__hopperFinishRepairEarly','laneSwap:swap','pares→impares','centro→bordes','bloques/stream físico','Teórico perfecto:'])if(!patched.includes(n))throw new Error(`Runtime missing ${n}`);
          const cycles=n=>n>0?Math.max(1,Math.floor(1500/n)):1;for(const [n,w] of [[1,1500],[50,30],[100,15],[290,5],[499,3],[500,3],[501,2],[1501,1]])if(cycles(n)!==w)throw new Error(`repair ${n}: ${cycles(n)} != ${w}`);
          console.log('Dynamic repair + diversity + early finish: PASS');

          const HEADER=28,PILOT=32,GRID=56,BASE=367,TOTAL=4603;const payload=b=>Math.floor((GRID*GRID-PILOT)*b/8)-HEADER,lane=b=>Math.max(1,Math.floor((payload(b)-1)/(BASE+6))),per=[2,3,4].map(b=>lane(b)*2),streams=per.map(n=>Math.ceil(TOTAL/n));if(JSON.stringify(per)!=='[4,6,8]'||JSON.stringify(streams)!=='[1151,768,576]')throw new Error(`projection packing ${per}/${streams}`);
          for(const n of ['repeat:2','dataSec=streams*sp.repeat/sp.fps','bps=perPhysical*BASE_CHUNK*sp.fps/sp.repeat','Configuración seleccionada','bloques/stream físico'])if(!projection.includes(n))throw new Error(`Projection missing ${n}`);
          console.log('Projection density + repeat-aware timing: PASS');

          for(const n of ['bottomDocks:true','dualAwareHints:true','earlyRepairFinish:true','senderActionDock','streamActions','Finalizar ronda','Teórico perfecto:','flowCoachTitle'])if(!premium.includes(n))throw new Error(`Premium UI missing ${n}`);
          for(const n of ['REPAIR_BUDGET=1500','streamActions','btn:not(#repairReacquireStart)','clean-target-bottom-dock'])if(!repair.includes(n))throw new Error(`Repair target missing ${n}`);if(repair.includes('TYPE.DATA')||repair.includes('makePacket('))throw new Error('Repair target generates DATA');
          for(const n of ['telemetryMount','Pico instantáneo','Los ciclos rotan orden y lanes'])if(!telemetry.includes(n))throw new Error(`Telemetry missing ${n}`);
          for(const n of ['adaptiveDetection:true','reuseMemory'])if(!bridge.includes(n))throw new Error(`Bridge missing ${n}`);for(const n of ['DUAL LANE TRAINING'])if(!warmup.includes(n))throw new Error(`Warmup missing ${n}`);
          for(const n of ['transform:translateY(-18px)!important','aspect-ratio:1/2!important','height:5.8%!important'])if(!stageCss.includes(n))throw new Error(`Safe stage missing ${n}`);
          for(const n of ['.actionDock','.streamActions','.flowCoach','.internalRepairTrigger','.techDetails'])if(!styles.includes(n))throw new Error(`Styles missing ${n}`);

          for(const n of ['MVP v0.9.14 · Premium Flow','id="senderActionDock"','id="streamActions"','id="telemetryMount"','id="flowCoach"','premium-flow-ui.js?v=0914','hps7-projection.js?v=0914','repair-reacquisition.js?v=0914','hps7-duallane-v2.js?v=0914'])if(!html.includes(n))throw new Error(`HTML missing ${n}`);
          const gp=html.indexOf('runtime-syntax-guard.js?v=0914'),bp=html.indexOf('binary-tag-bridge-fast.js?v=0914'),up=html.indexOf('premium-flow-ui.js?v=0914'),pp=html.indexOf('hps7-projection.js?v=0914'),qp=html.indexOf('repair-reacquisition.js?v=0914'),rp=html.indexOf('hps7-duallane-v2.js?v=0914');if(!(gp>=0&&gp<bp&&bp<up&&up<pp&&pp<qp&&qp<rp))throw new Error('v0914 load order failed');
          for(const a of ['premium-flow-ui.js?v=0914','hps7-projection.js?v=0914','repair-reacquisition.js?v=0914','hps7-duallane-v2.js?v=0914','binary-stage.css?v=0914','styles.css?v=0914'])if(!sw.includes(a))throw new Error(`SW missing ${a}`);if(!sw.includes('hopperlink-pixelstream-v0914'))throw new Error('cache not v0914');
          console.log('v0.9.14 Premium Flow invariants: PASS');
          NODE
