name: HopperLink Runtime Check

on:
  push:
    paths:
      - 'hopperlink-pixelstream/**'
      - '.github/workflows/hopperlink-runtime-check.yml'
  workflow_dispatch:

jobs:
  syntax-and-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          set -e
          for f in hopperlink-pixelstream/*.js; do node --check "$f"; done
      - name: Validate v0.9.15 Stability Pass and real Prepare HPS7
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm'),{webcrypto}=require('crypto'),{performance}=require('perf_hooks');
          const p='hopperlink-pixelstream',read=n=>fs.readFileSync(`${p}/${n}`,'utf8');
          const manual=read('hps7-manual-max.js'),dual=read('hps7-duallane-v2.js'),repair=read('repair-reacquisition.js'),projection=read('hps7-projection.js'),premium=read('premium-flow-ui.js'),stability=read('runtime-stability.js'),telemetry=read('transfer-telemetry.js'),core=read('hps7.js'),guard=read('runtime-syntax-guard.js'),stage=read('binary-stage.css'),styles=read('styles.css'),html=read('index.html'),sw=read('sw.js');

          function extract(src,start,name){const a=src.indexOf(start),b=src.indexOf('\nfunction loadScript',a);if(a<0||b<=a)throw Error(`${name} extraction failed`);const c={console};vm.createContext(c);vm.runInContext(src.slice(a,b)+`\n;globalThis.__fn=${name};`,c);return c.__fn;}
          function repairPatch(src){const a=src.indexOf('function patchManualRuntimeSource'),b=src.indexOf('\nwindow.fetch=async function',a),c={console};if(a<0||b<=a)throw Error('repair patch extraction failed');vm.createContext(c);vm.runInContext(src.slice(a,b)+'\n;globalThis.__p=patchManualRuntimeSource;',c);return c.__p;}
          const patched=extract(dual,'function replaceOne','patchDual')(extract(repairPatch(repair)(manual),'function replaceOne','patchCore')(core));

          let rawErr=null;try{new Function(patched)}catch(e){rawErr=e}
          const events=[],g={Function,dispatchEvent:e=>events.push(e)};class CE{constructor(type,init={}){this.type=type;this.detail=init.detail}}
          const gc={globalThis:g,CustomEvent:CE,console,Object};vm.createContext(gc);vm.runInContext(guard,gc);const compiled=g.Function(`${patched}\n//# sourceURL=hps7-core-v0915-stable.js`);if(typeof compiled!=='function')throw Error('generated core compile failed');if(g.Function!==Function)throw Error('Function not restored');if(rawErr&&!events.some(e=>e.type==='hopper:runtime-syntax-fixed'))throw Error('guard did not report repair');
          console.log('Generated HPS7 v0.9.15 core compile: PASS');

          for(const s of ['repairPassGroups','repairOrderName','finishRepairRequested','window.__hopperFinishRepairEarly','physicalBps','bloques/stream físico'])if(!patched.includes(s))throw Error(`runtime missing ${s}`);
          const cycles=n=>n>0?Math.max(1,Math.floor(1500/n)):1;for(const [n,w] of [[1,1500],[50,30],[290,5],[499,3],[500,3],[501,2],[1501,1]])if(cycles(n)!==w)throw Error(`repair ${n}`);
          const payload=b=>Math.floor((56*56-32)*b/8)-28,lane=b=>Math.max(1,Math.floor((payload(b)-1)/(367+6))),per=[2,3,4].map(b=>lane(b)*2),streams=per.map(n=>Math.ceil(4603/n));if(JSON.stringify(per)!=='[4,6,8]'||JSON.stringify(streams)!=='[1151,768,576]')throw Error('packing/projection');
          for(const s of ['dataSec=streams*sp.repeat/sp.fps','bps=perPhysical*BASE_CHUNK*sp.fps/sp.repeat','Configuración seleccionada'])if(!projection.includes(s))throw Error(`projection missing ${s}`);

          if(!premium.includes("attributeFilter:['disabled']"))throw Error('premium must observe send.disabled only');
          if(premium.includes("attributeFilter:['disabled','style','class']"))throw Error('premium reintroduced style/class observer feedback loop');
          for(const s of ['setDisplay(el,value)','el.style.display!==value','runtimeReady','Inicializando HPS7'])if(!premium.includes(s))throw Error(`premium stability missing ${s}`);
          for(const s of ['validateRuntime','wrapPrepare','__hopperPrepareBusy','prepare-complete','prepare-error','startup-timeout'])if(!stability.includes(s))throw Error(`stability guard missing ${s}`);
          for(const s of ['clean-target-bottom-dock','btn:not(#repairReacquireStart)','streamActions'])if(!repair.includes(s))throw Error(`repair target missing ${s}`);
          if(repair.includes('TYPE.DATA')||repair.includes('makePacket('))throw Error('repair target generates DATA');
          for(const s of ['telemetryMount','Pico instantáneo'])if(!telemetry.includes(s))throw Error(`telemetry missing ${s}`);
          for(const s of ['transform:translateY(-18px)!important','aspect-ratio:1/2!important'])if(!stage.includes(s))throw Error(`stage missing ${s}`);
          for(const s of ['.actionDock','.streamActions','.flowCoach','.techDetails'])if(!styles.includes(s))throw Error(`styles missing ${s}`);

          const order=['runtime-syntax-guard.js?v=0915','binary-tag-bridge-fast.js?v=0915','premium-flow-ui.js?v=0915','hps7-projection.js?v=0915','repair-reacquisition.js?v=0915','hps7-duallane-v2.js?v=0915','runtime-stability.js?v=0915'];let prev=-1;for(const s of order){const i=html.indexOf(s);if(i<0||i<=prev)throw Error(`load order ${s}`);prev=i}
          if(!html.includes('id="prepareBtn" disabled>Inicializando HPS7…</button>'))throw Error('Prepare must start gated');
          for(const s of ['runtime-stability.js?v=0915','hps7-duallane-v2.js?v=0915','premium-flow-ui.js?v=0915','hps7-projection.js?v=0915'])if(!sw.includes(s))throw Error(`SW missing ${s}`);
          if(!sw.includes('hopperlink-pixelstream-v0915'))throw Error('cache key not v0915');

          class ClassList{constructor(){this.s=new Set()}add(...x){x.forEach(v=>this.s.add(v))}remove(...x){x.forEach(v=>this.s.delete(v))}contains(x){return this.s.has(x)}toggle(x,on){if(on===undefined)on=!this.s.has(x);on?this.s.add(x):this.s.delete(x);return on}}
          const mk=(id)=>({id,textContent:'',className:'',disabled:false,value:'',style:{display:''},classList:new ClassList(),files:[],srcObject:null,onclick:null,onchange:null,selectedOptions:[{textContent:''}],addEventListener(){},scrollIntoView(){}});
          const ids=['prepareBtn','sendBtn','txRepairBtn','cameraBtn','stopCameraBtn','overlayActionBtn','closeStream','gridSize','speedMode','modulationMode','streamShape','speedHint','modulationHint','layoutHint','throughputHint','capacity','cameraChip','wakeChip','phaseStatus','sendLog','rxLog','streamOverlay','streamMeta','streamBottom','video','receiverPanel','capture','pixelCanvas','rxFrames','rxTotal','rxMissing','rxBar','receivedBox','rxErrors','rxElapsed','rxRate','rxEta','guideCanvas','lockQuality','fileInput','fileSize','frameCount'];
          const els=Object.fromEntries(ids.map(id=>[id,mk(id)]));
          els.sendBtn.disabled=true;els.sendBtn.style.display='none';els.txRepairBtn.style.display='none';els.streamOverlay.style.display='none';els.gridSize.value='56';els.speedMode.value='maxcal';els.speedMode.selectedOptions=[{textContent:'Auto Max'}];els.modulationMode.value='gray2';els.streamShape.value='tall2';els.stopCameraBtn.disabled=true;
          const testBytes=new Uint8Array(1024*1024+321);for(let i=0;i<testBytes.length;i+=4096)testBytes[i]=i&255;
          els.fileInput.files=[{name:'prepare-smoke.bin',type:'application/octet-stream',size:testBytes.length,lastModified:Date.now(),arrayBuffer:async()=>testBytes.buffer.slice(0)}];
          const listeners={};
          const doc={readyState:'complete',documentElement:{classList:new ClassList()},getElementById:id=>els[id]||null,querySelectorAll:()=>[],createElement:tag=>mk(tag),head:{appendChild(){}}};
          const ctx={console,document:doc,navigator:{mediaDevices:{getUserMedia:async()=>{throw Error('camera not used in prepare smoke')}}},location:{protocol:'file:'},TextEncoder,TextDecoder,crypto:webcrypto,performance,CustomEvent:CE,MutationObserver:class{observe(){}},alert:()=>{},confirm:()=>true,setTimeout,clearTimeout,setInterval:()=>0,clearInterval:()=>{},requestAnimationFrame:cb=>setTimeout(()=>cb(performance.now()),0)};
          ctx.window=ctx;ctx.globalThis=ctx;ctx.addEventListener=(type,fn)=>(listeners[type]||(listeners[type]=[])).push(fn);ctx.dispatchEvent=e=>{for(const fn of listeners[e.type]||[])fn(e);return true};
          vm.createContext(ctx);
          const bad="else showNack(p.round,suggest);}}}\nfunction controlPayloadNack",good="else showNack(p.round,suggest);}}\nfunction controlPayloadNack",runnable=patched.includes(bad)?patched.replace(bad,good):patched;
          vm.runInContext(runnable,ctx,{timeout:2500,filename:'hps7-core-smoke.js'});
          ctx.__hopperRuntime={version:'0.9.15-smoke'};
          vm.runInContext(stability,ctx,{timeout:1000,filename:'runtime-stability-smoke.js'});
          ctx.dispatchEvent(new CE('hopper:runtime-ready',{detail:ctx.__hopperRuntime}));
          if(els.prepareBtn.disabled)throw Error('Prepare remained disabled after runtime-ready');

          Promise.race([els.prepareBtn.onclick(),new Promise((_,rej)=>setTimeout(()=>rej(Error('Prepare HPS7 smoke timed out')),3500))]).then(()=>{
            const total=Number(els.frameCount.textContent);if(!Number.isFinite(total)||total<1000)throw Error(`Prepare produced invalid total ${els.frameCount.textContent}`);
            if(els.sendBtn.disabled)throw Error('Prepare did not enable HELLO');
            if(ctx.__hopperPrepareBusy)throw Error('Prepare busy guard did not clear');
            console.log(`Real Prepare HPS7 smoke: PASS · ${total} logical blocks · HELLO enabled`);
            console.log('v0.9.15 Stability Pass invariants: PASS');
          }).catch(e=>{console.error(e);process.exitCode=1;});
          NODE
