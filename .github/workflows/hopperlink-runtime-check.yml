name: HopperLink Runtime Check

on:
  push:
    paths:
      - 'hopperlink-pixelstream/**'
      - '.github/workflows/hopperlink-runtime-check.yml'
  workflow_dispatch:

jobs:
  syntax-and-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          set -e
          for f in hopperlink-pixelstream/*.js; do
            echo "Checking $f"
            node --check "$f"
          done
      - name: Validate DualLane + tiered Repair runtime
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const p='hopperlink-pixelstream';
          const manual=fs.readFileSync(`${p}/hps7-manual-max.js`,'utf8');
          const dual=fs.readFileSync(`${p}/hps7-duallane-v2.js`,'utf8');
          const repair=fs.readFileSync(`${p}/repair-reacquisition.js`,'utf8');
          const core=fs.readFileSync(`${p}/hps7.js`,'utf8');
          const guard=fs.readFileSync(`${p}/runtime-syntax-guard.js`,'utf8');
          const bridge=fs.readFileSync(`${p}/binary-tag-bridge-fast.js`,'utf8');
          const warmup=fs.readFileSync(`${p}/color-warmup.js`,'utf8');
          const stageCss=fs.readFileSync(`${p}/binary-stage.css`,'utf8');
          const html=fs.readFileSync(`${p}/index.html`,'utf8');
          const sw=fs.readFileSync(`${p}/sw.js`,'utf8');

          function extract(src,start,name){
            const a=src.indexOf(start),b=src.indexOf('\nfunction loadScript',a);
            if(a<0||b<=a)throw new Error(`${name} extraction failed`);
            const c={console};vm.createContext(c);
            vm.runInContext(src.slice(a,b)+`\n;globalThis.__fn=${name};`,c,{filename:`${name}.js`});
            return c.__fn;
          }
          function extractRepairPolicy(src){
            const a=src.indexOf('function patchManualRuntimeSource'),b=src.indexOf('\nwindow.fetch=async function',a);
            if(a<0||b<=a)throw new Error('repair policy extraction failed');
            const c={console};vm.createContext(c);
            vm.runInContext(src.slice(a,b)+'\n;globalThis.__patch=patchManualRuntimeSource;',c,{filename:'repair-policy.js'});
            return c.__patch;
          }

          const patchedManualText=extractRepairPolicy(repair)(manual);
          const patched=extract(dual,'function replaceOne','patchDual')(extract(patchedManualText,'function replaceOne','patchCore')(core));

          let rawErr=null;try{new Function(patched);}catch(e){rawErr=e;}
          const events=[],g={Function,dispatchEvent:e=>events.push(e)};
          class CE{constructor(type,init={}){this.type=type;this.detail=init.detail;}}
          const gc={globalThis:g,CustomEvent:CE,console,Object};vm.createContext(gc);
          vm.runInContext(guard,gc,{filename:'runtime-syntax-guard.js'});
          const compiled=g.Function(`${patched}\n//# sourceURL=hps7-core-v0911-duallane.js`);
          if(typeof compiled!=='function')throw new Error('guarded dual core did not compile');
          if(g.Function!==Function)throw new Error('native Function not restored');
          if(rawErr&&!events.some(e=>e.type==='hopper:runtime-syntax-fixed'))throw new Error('syntax guard did not fire');
          console.log('Generated HPS7 v0.9.11 compile: PASS');

          for(const n of ['const BASE_CHUNK = 367;','n>0&&n<100?10:n>0&&n<500?3:1',"bits===2)return{label:'2-bit Max',fps:15","bits===3)return{label:'3-bit Max',fps:12","return{label:'4-bit Max',fps:10",'renderDualPackets',"function laneY(lane){return lane===0?[DATA_MIN,.5]:lane===1?[.5,DATA_MAX]",'tall:tallSelected()','rx.tall=tall','for(const z of (r.all||[r]))dispatchPacket(z.p)'])if(!patched.includes(n))throw new Error(`Missing runtime invariant: ${n}`);

          // Verify exact strict-less-than policy requested by the user.
          const cycles=n=>n>0&&n<100?10:n>0&&n<500?3:1;
          const cases=[[1,10],[99,10],[100,3],[499,3],[500,1],[900,1]];
          for(const [n,want] of cases)if(cycles(n)!==want)throw new Error(`Repair cycles ${n}: got ${cycles(n)} want ${want}`);
          console.log('Repair policy: 1–99 ×10 · 100–499 ×3 · 500+ ×1: PASS');

          const HEADER=28,PILOT=32,GRID=56,BASE=367;
          const payload=bits=>Math.floor((GRID*GRID-PILOT)*bits/8)-HEADER;
          const laneChunks=bits=>Math.max(1,Math.floor((payload(bits)-1)/(BASE+6)));
          const square=[laneChunks(2),laneChunks(3),laneChunks(4)],physical=square.map(x=>x*2);
          if(JSON.stringify(square)!==JSON.stringify([2,3,4]))throw new Error(`Square packing wrong: ${square}`);
          if(JSON.stringify(physical)!==JSON.stringify([4,6,8]))throw new Error(`Dual packing wrong: ${physical}`);
          console.log('DualLane packing: PASS ·',physical.join('/'),'blocks per physical frame');

          for(const n of ['adaptiveDetection:true','frameSeq%3!==0','frameSeq%2!==0','reuseMemory'])if(!bridge.includes(n))throw new Error(`Fast bridge missing ${n}`);
          for(const n of ['tallSelected()',"rows=tall?112:56",'DUAL LANE TRAINING'])if(!warmup.includes(n))throw new Error(`Dual warmup missing ${n}`);
          for(const n of ['html.stream-tall .pixelFrame','aspect-ratio:1/2!important','html.stream-tall .finder','height:5.8%!important','top:3.1%!important','bottom:3.1%!important'])if(!stageCss.includes(n))throw new Error(`Physical tall-stage CSS missing ${n}`);

          for(const n of ['REPAIR TARGET','Receptor listo · Iniciar Repair','MutationObserver','originalRepair.call','renderTarget()','static-target-before-real-repair','under100:10','under500:3'])if(!repair.includes(n))throw new Error(`Repair module missing ${n}`);
          if(repair.includes('TYPE.DATA')||repair.includes('makePacket('))throw new Error('Repair target must not generate HPS7 DATA packets');
          console.log('Repair Reacquisition + tiered policy invariants: PASS');

          for(const n of ['MVP v0.9.11 · Tiered Repair Burst','Repair 1–99 ×10','Repair 100–499 ×3','id="streamShape"','value="tall2" selected'])if(!html.includes(n))throw new Error(`UI missing ${n}`);
          const gp=html.indexOf('runtime-syntax-guard.js?v=0911'),bp=html.indexOf('binary-tag-bridge-fast.js?v=0911'),qp=html.indexOf('repair-reacquisition.js?v=0911'),rp=html.indexOf('hps7-duallane-v2.js?v=0911');
          if(gp<0||bp<0||qp<0||rp<0||!(gp<bp&&bp<qp&&qp<rp))throw new Error('load order guard -> bridge -> repair policy -> dual runtime failed');
          for(const asset of ['runtime-syntax-guard.js?v=0911','binary-tag-bridge-fast.js?v=0911','binary-tag-status.js?v=0911','repair-reacquisition.js?v=0911','hps7-duallane-v2.js?v=0911','hps7-manual-max.js?v=098','binary-stage.css?v=0911'])if(!sw.includes(asset))throw new Error(`SW missing ${asset}`);
          if(!sw.includes('hopperlink-pixelstream-v0911'))throw new Error('cache key not v0911');
          console.log('v0.9.11 Tiered Repair Burst invariants: PASS');
          NODE
