name: Apply AnchorScan 1300

on:
  push:
    paths:
      - '.github/workflows/apply-anchor-scan-v1300.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and apply checked migration
        shell: bash
        run: |
          python <<'PY'
          import hashlib, io, tarfile
          from pathlib import Path
          source = Path('hopperlink-pixelstream/src/hopper-one-runtime.js').read_text()
          assert 'const VERSION = "1.2.4";' in source, 'Unexpected baseline; refusing to overwrite'
          data = b''.join(Path(f'maintenance/anchor1300.part-{n}').read_bytes() for n in range(1,5))
          assert hashlib.sha256(data).hexdigest() == 'd6776074045f20b414f403e715f60818fe72c6dee56df61b4d165e559643d6c9', 'Migration integrity mismatch'
          with tarfile.open(fileobj=io.BytesIO(data),mode='r:gz') as archive:
              for item in archive.getmembers():
                  assert item.isfile() and item.name.startswith(('hopperlink-pixelstream/','maintenance/anchor1300/')), 'Unexpected member'
                  assert '..' not in Path(item.name).parts
              archive.extractall('.', filter='data')
          PY
          python maintenance/anchor1300/apply1.py
          python maintenance/anchor1300/apply2.py
          python maintenance/anchor1300/apply3.py
      - name: Build and validate production scanner
        shell: bash
        run: |
          HOPPER_BUILD=1300 node hopperlink-pixelstream/tools/build-runtime.mjs
          node --check hopperlink-pixelstream/anchor-scan.js
          node --check hopperlink-pixelstream/anchor-worker.js
          node --check hopperlink-pixelstream/src/hopper-one-runtime.js
          node --check hopperlink-pixelstream/hopper-one.js
          node --check hopperlink-pixelstream/sw.js
          node hopperlink-pixelstream/tests/hopper-one-color-modes.test.cjs
          node hopperlink-pixelstream/tests/hopper-one-unobstructed.test.cjs
          node hopperlink-pixelstream/tests/hopper-one-anchor-scan.test.cjs
      - name: Publish only validated application files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hopperlink-pixelstream
          git rm maintenance/anchor1300.part-1 maintenance/anchor1300.part-2 maintenance/anchor1300.part-3 maintenance/anchor1300.part-4
          git commit -m 'feat: replace ring scanning with motion-aware coded AnchorScan 1300'
          git push origin HEAD:main
