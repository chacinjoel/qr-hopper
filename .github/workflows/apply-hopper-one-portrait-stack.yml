name: Apply HopperLink ONE Portrait Stack

on:
  push:
    paths:
      - '.github/workflows/apply-hopper-one-portrait-stack.yml'

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply portrait-only fullscreen stack
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import json
          import re

          root = Path('hopperlink-pixelstream')

          def replace_one(path, old, new):
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one occurrence, found {count}: {old[:80]!r}')
              path.write_text(text.replace(old, new), encoding='utf-8')

          runtime = root / 'src' / 'hopper-one-runtime.js'
          replace_one(runtime, 'const VERSION = "1.2.0";', 'const VERSION = "1.2.1";')
          replace_one(
              runtime,
              '''  function activeGrid() {
            const portrait = window.innerHeight > window.innerWidth;
            return portrait
              ? { cols: LONG_SIDE, rows: SHORT_SIDE, portrait: true }
              : { cols: SHORT_SIDE, rows: LONG_SIDE, portrait: false };
          }''',
              '''  function activeGrid() {
            return { cols: LONG_SIDE, rows: SHORT_SIDE, portrait: true };
          }'''
          )
          replace_one(runtime, 'async function tryLandscapeLock()', 'async function tryPortraitLock()')
          replace_one(runtime, 'screen.orientation.lock("landscape")', 'screen.orientation.lock("portrait")')
          replace_one(runtime, '{ orientation: "landscape" }', '{ orientation: "portrait" }')
          replace_one(runtime, 'tryLandscapeLock();', 'tryPortraitLock();')

          runtime_text = runtime.read_text(encoding='utf-8')
          runtime_text, count = re.subn(r'"\./sw\.js\?v=\d+"', '"./sw.js?v=1201"', runtime_text)
          if count != 1:
              raise RuntimeError(f'runtime service-worker version replacements: {count}')
          runtime.write_text(runtime_text, encoding='utf-8')

          css = root / 'premium-one-fullscreen.css'
          replace_one(
              css,
              'min-height:0;flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;',
              'min-height:0;flex:1;display:grid;grid-template-columns:1fr;grid-template-rows:repeat(3,minmax(0,1fr));gap:6px;'
          )
          css_text = css.read_text(encoding='utf-8')
          css_text += '\n/* Portrait-only TriFrame stack v1.2.1 */\n.orientation-note{display:none!important}\n.triframe-grid{grid-template-columns:1fr!important;grid-template-rows:repeat(3,minmax(0,1fr))!important}\n'
          css.write_text(css_text, encoding='utf-8')

          index = root / 'index.html'
          text = index.read_text(encoding='utf-8')
          text = text.replace('v=1200', 'v=1201')
          text = text.replace('Abrir fullscreen TriFrame', 'Abrir fullscreen vertical')
          text = text.replace('Gira el teléfono: en horizontal los tres cuadrantes aprovechan más superficie.', 'Modo vertical: los cuadrantes A, B y C permanecen apilados en una columna.')
          text = text.replace('Los tres HELLO contienen la misma sesión para adquisición inmediata.', 'Los tres HELLO apilados contienen la misma sesión para adquisición inmediata.')
          text = text.replace('HopperCore 1.2 · TriFrame 3-Lane', 'HopperCore 1.2.1 · TriFrame vertical 3-Lane')
          index.write_text(text, encoding='utf-8')

          loader = root / 'hopper-one.js'
          loader_text = loader.read_text(encoding='utf-8').replace('v=1200', 'v=1201')
          loader.write_text(loader_text, encoding='utf-8')

          sw = root / 'sw.js'
          sw_text = sw.read_text(encoding='utf-8').replace('v1200', 'v1201').replace('v=1200', 'v=1201')
          sw.write_text(sw_text, encoding='utf-8')

          build = root / 'tools' / 'build-runtime.mjs'
          replace_one(build, "process.env.HOPPER_BUILD || '1200'", "process.env.HOPPER_BUILD || '1201'")

          manifest = root / 'manifest.json'
          manifest_data = json.loads(manifest.read_text(encoding='utf-8'))
          manifest_data['orientation'] = 'portrait'
          manifest_data['description'] = 'Transferencia offline premium en fullscreen vertical con tres lanes apilados y modulación seleccionable de 2, 3 y 4 bits.'
          manifest.write_text(json.dumps(manifest_data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          readme = root / 'README.md'
          readme_text = readme.read_text(encoding='utf-8')
          readme_text = readme_text.replace('# HopperLink ONE · HopperCore 1.2', '# HopperLink ONE · HopperCore 1.2.1')
          readme_text = readme_text.replace(
              'HopperLink ONE utiliza un único motor óptico adaptativo con tres cuadrantes fullscreen.',
              'HopperLink ONE utiliza un único motor óptico adaptativo con tres cuadrantes apilados en fullscreen vertical.'
          )
          marker = '- **TriFrame 3-Lane:** tres paquetes físicos independientes por actualización de pantalla.\n'
          if marker in readme_text and 'Portrait Stack' not in readme_text:
              readme_text = readme_text.replace(marker, marker + '- **Portrait Stack:** A, B y C permanecen en una sola columna; la app solicita orientación retrato y nunca reorganiza el emisor en tres columnas.\n')
          readme.write_text(readme_text, encoding='utf-8')

          test = root / 'tests' / 'hopper-one-color-modes.test.cjs'
          test_text = test.read_text(encoding='utf-8').replace("manifest.build,'1200'", "manifest.build,'1201'").replace("sw.includes('hopperlink-one-v1200')", "sw.includes('hopperlink-one-v1201')")
          anchor = "console.log('HopperLink ONE Color Modes 2/3/4-bit: PASS');"
          portrait_checks = """const fullscreenCss=fs.readFileSync(path.join(root,'premium-one-fullscreen.css'),'utf8');
          assert(fullscreenCss.includes('grid-template-columns:1fr!important'));
          assert(fullscreenCss.includes('grid-template-rows:repeat(3,minmax(0,1fr))!important'));
          assert(source.includes('screen.orientation.lock(\"portrait\")'));
          assert(!source.includes('tryLandscapeLock'));
          assert(source.includes('return { cols: LONG_SIDE, rows: SHORT_SIDE, portrait: true };'));
          const webManifest=JSON.parse(fs.readFileSync(path.join(root,'manifest.json'),'utf8'));
          assert.strictEqual(webManifest.orientation,'portrait');
          assert(!html.includes('Gira el teléfono'));
          console.log('HopperLink ONE Color Modes + Portrait Stack: PASS');"""
          if anchor not in test_text:
              raise RuntimeError('test console anchor not found')
          test_text = test_text.replace(anchor, portrait_checks)
          test.write_text(test_text, encoding='utf-8')

          print('Applied portrait-only fullscreen stack.')
          PY

      - name: Format canonical runtime
        run: npx --yes prettier@3.6.2 --write hopperlink-pixelstream/src/hopper-one-runtime.js

      - name: Build compressed browser runtime
        run: HOPPER_BUILD=1201 node hopperlink-pixelstream/tools/build-runtime.mjs

      - name: Validate implementation
        run: |
          node --check hopperlink-pixelstream/src/hopper-one-runtime.js
          node --check hopperlink-pixelstream/hopper-one.js
          node --check hopperlink-pixelstream/sw.js
          node --check hopperlink-pixelstream/tools/build-runtime.mjs
          node hopperlink-pixelstream/tests/hopper-one-color-modes.test.cjs

      - name: Commit portrait application files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hopperlink-pixelstream/index.html
          git add hopperlink-pixelstream/premium-one-fullscreen.css
          git add hopperlink-pixelstream/src/hopper-one-runtime.js
          git add hopperlink-pixelstream/hopper-one.js
          git add hopperlink-pixelstream/hopper-one.runtime.json
          git add hopperlink-pixelstream/runtime/hopper-one.bundle-01.txt
          git add hopperlink-pixelstream/runtime/hopper-one.bundle-02.txt
          git add hopperlink-pixelstream/sw.js
          git add hopperlink-pixelstream/manifest.json
          git add hopperlink-pixelstream/README.md
          git add hopperlink-pixelstream/tools/build-runtime.mjs
          git add hopperlink-pixelstream/tests/hopper-one-color-modes.test.cjs
          git diff --cached --quiet && exit 0
          git commit -m 'feat: keep TriFrame fullscreen vertical in a three-row stack'
          git push
