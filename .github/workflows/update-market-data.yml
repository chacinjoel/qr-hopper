name: Update TradeLab market data

on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tradelab-market-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and rebuild market datasets
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: python3 trade-risk-calculator/historico/update_data.py
      - name: Publish changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trade-risk-calculator/historico/fred_data.js \
                  trade-risk-calculator/historico/macro_data.js \
                  trade-risk-calculator/historico/data.js \
                  trade-risk-calculator/historico/data_status.json
          git diff --cached --quiet && exit 0
          git commit -m "Update TradeLab market data"
          git push
