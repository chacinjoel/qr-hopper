<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Casa 8×16 · Opciones 2D / 3D</title>
<style>
:root{--bg:#0b1020;--panel:#11182b;--line:#2b3858;--text:#eef3ff;--muted:#aebbd6;--accent:#73d3ff}
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
#app{height:100%;display:grid;grid-template-columns:340px 1fr}.panel{background:linear-gradient(180deg,#11182b,#0d1424);border-right:1px solid var(--line);padding:16px;overflow:auto;z-index:4}
h1{font-size:20px;margin:0 0 6px}.sub{font-size:12px;color:var(--muted);line-height:1.5;margin:0 0 10px}.card{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}.card h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#d5e3ff;margin:0 0 9px}.row{display:flex;gap:8px;flex-wrap:wrap}.btn,select{border:1px solid #3a5079;background:#18253f;color:var(--text);border-radius:10px;padding:9px 11px;font-size:12px}.btn{cursor:pointer}.btn.active{outline:2px solid var(--accent);background:#17364d}.mode{flex:1;font-weight:800}select{width:100%;font-weight:700}.note{font-size:11px;line-height:1.55;color:#c4d2eb;background:#111b2f;border:1px solid #263657;border-radius:10px;padding:10px}.compare{display:grid;grid-template-columns:1fr auto;gap:6px 10px;font-size:12px}.compare span:nth-child(odd){color:var(--muted)}
#stage{position:relative;min-width:0;background:#0a1020}.view{position:absolute;inset:0}.hidden{display:none!important}#planWrap{background:#eef2f6;display:flex;align-items:center;justify-content:center;padding:10px;overflow:auto;-webkit-overflow-scrolling:touch}#plan2d{display:block;width:auto;height:calc(100% - 20px);max-width:100%;max-height:calc(100% - 20px)}#scene3d{width:100%;height:100%;display:block;touch-action:none}.hud{position:absolute;top:12px;left:12px;right:12px;z-index:3;display:flex;justify-content:space-between;pointer-events:none}.pill{pointer-events:auto;background:rgba(8,13,25,.82);border:1px solid #31415f;color:#dbe8ff;padding:8px 11px;border-radius:999px;font-size:12px}.bottom{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:3;background:rgba(8,13,25,.84);border:1px solid #31415f;color:#bdc9df;padding:8px 12px;border-radius:12px;font-size:11px;text-align:center;max-width:min(900px,94%)}.mobile{display:none}
@media(max-width:900px){#app{grid-template-columns:1fr}.panel{position:absolute;left:0;top:0;bottom:0;width:min(350px,92vw);transform:translateX(-100%);transition:.2s;box-shadow:0 25px 80px #0008}.panel.open{transform:none}.mobile{display:block}.hud{left:55px}#planWrap{padding:6px}#plan2d{height:calc(100% - 12px);max-height:calc(100% - 12px)}}
</style>
</head>
<body>
<div id="app">
<aside class="panel" id="panel">
<h1>Casa 8×16 · Comparador</h1>
<p class="sub">Opción 1 conserva el diseño actual. Opción 2 agrega una habitación y un baño interior sin aumentar el volumen 8×16.</p>
<div class="card"><h2>Diseño</h2><select id="designSelect"><option value="opt1">Opción 1 · Original</option><option value="opt2">Opción 2 · 4 habitaciones</option></select></div>
<div class="card"><h2>Vista</h2><div class="row"><button class="btn mode active" id="btn3d">◈ 3D</button><button class="btn mode" id="btn2d">▦ 2D</button></div></div>
<div class="card"><h2>Cámara 3D</h2><div class="row"><button class="btn active" data-cam="persp">Perspectiva</button><button class="btn" data-cam="front">Frente</button><button class="btn" data-cam="rear">Fondo</button><button class="btn" data-cam="left">Izquierda</button><button class="btn" data-cam="right">Derecha</button></div></div>
<div class="card"><h2>Resumen</h2><div class="compare" id="summary"></div></div>
<div class="note" id="optionNote"></div>
</aside>
<main id="stage">
<button class="btn mobile" id="menuBtn" style="position:absolute;left:10px;top:10px;z-index:8">☰</button>
<div class="hud"><div class="pill" id="helpPill">Opción 1 · Vista 3D</div><div class="pill" id="modePill">Vista 3D</div></div>
<div id="planWrap" class="view hidden"><svg id="plan2d" viewBox="0 0 1200 2000" preserveAspectRatio="xMidYMid meet"></svg></div>
<canvas id="scene3d" class="view"></canvas>
<div class="bottom" id="bottomText"></div>
</main>
</div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const COMMON={front:{x:0,z:-4,w:8,d:4},rear:{x:0,z:16,w:8,d:2},house:{x:0,z:0,w:8,d:16},annex:{x:8,z:14,w:4,d:2},entryX:4.15};
const plans={
opt1:{name:'Opción 1 · Original',rooms:3,baths:2,roomSize:'4 × 4 m',bathSize:'4 × 2 m',note:'Tres habitaciones amplias de 4×4 m. Los dos primeros dormitorios tienen baño privado. El baño anexo sirve a la tercera habitación y a visitas. Sala, comedor y cocina conservan sus dimensiones actuales.',spaces:[{id:'r1',name:'HAB. 1',sub:'4×4',x:0,z:0,w:4,d:4,t:'room'},{id:'b1',name:'BAÑO 1',sub:'4×2 · privado',x:0,z:4,w:4,d:2,t:'bath'},{id:'r2',name:'HAB. 2',sub:'4×4',x:0,z:6,w:4,d:4,t:'room'},{id:'b2',name:'BAÑO 2',sub:'4×2 · privado',x:0,z:10,w:4,d:2,t:'bath'},{id:'r3',name:'HAB. 3',sub:'4×4',x:0,z:12,w:4,d:4,t:'room'},{id:'living',name:'SALA',sub:'4×6',x:4,z:0,w:4,d:6,t:'social'},{id:'dining',name:'COMEDOR',sub:'4×3',x:4,z:6,w:4,d:3,t:'social'},{id:'kitchen',name:'COCINA',sub:'4×3',x:4,z:9,w:4,d:3,t:'kitchen'},{id:'corridor',name:'CORREDOR',sub:'4×4',x:4,z:12,w:4,d:4,t:'corridor'},{id:'annex',name:'BAÑO ANEXO',sub:'4×2',x:8,z:14,w:4,d:2,t:'bath'}],roomDoors:[{z:1.55},{z:7.55},{z:13.55}],bathDoors:[{x:2.65,z:4},{x:2.65,z:10}],boundaries:[{z:4,door:true},{z:6},{z:10,door:true},{z:12}]},
opt2:{name:'Opción 2 · 4 habitaciones',rooms:4,baths:3,roomSize:'4 × 2.8 m',bathSize:'4 × 1.6 m',note:'Optimización propuesta: cuatro habitaciones de 4×2.8 m y tres baños privados de 4×1.6 m. El cuarto del fondo usa el baño anexo para visitas/uso compartido. El área social del lado derecho permanece igual, así que el cuarto adicional se obtiene reduciendo solo la profundidad de dormitorios y baños.',spaces:[{id:'r1',name:'HAB. 1',sub:'4×2.8',x:0,z:0,w:4,d:2.8,t:'room'},{id:'b1',name:'BAÑO 1',sub:'4×1.6 · privado',x:0,z:2.8,w:4,d:1.6,t:'bath'},{id:'r2',name:'HAB. 2',sub:'4×2.8',x:0,z:4.4,w:4,d:2.8,t:'room'},{id:'b2',name:'BAÑO 2',sub:'4×1.6 · privado',x:0,z:7.2,w:4,d:1.6,t:'bath'},{id:'r3',name:'HAB. 3',sub:'4×2.8',x:0,z:8.8,w:4,d:2.8,t:'room'},{id:'b3',name:'BAÑO 3',sub:'4×1.6 · privado',x:0,z:11.6,w:4,d:1.6,t:'bath'},{id:'r4',name:'HAB. 4',sub:'4×2.8',x:0,z:13.2,w:4,d:2.8,t:'room'},{id:'living',name:'SALA',sub:'4×6',x:4,z:0,w:4,d:6,t:'social'},{id:'dining',name:'COMEDOR',sub:'4×3',x:4,z:6,w:4,d:3,t:'social'},{id:'kitchen',name:'COCINA',sub:'4×3',x:4,z:9,w:4,d:3,t:'kitchen'},{id:'corridor',name:'CORREDOR',sub:'4×4',x:4,z:12,w:4,d:4,t:'corridor'},{id:'annex',name:'BAÑO ANEXO',sub:'4×2',x:8,z:14,w:4,d:2,t:'bath'}],roomDoors:[{z:.75},{z:5.15},{z:9.55},{z:13.95}],bathDoors:[{x:2.65,z:2.8},{x:2.65,z:7.2},{x:2.65,z:11.6}],boundaries:[{z:2.8,door:true},{z:4.4},{z:7.2,door:true},{z:8.8},{z:11.6,door:true},{z:13.2}]}}
const svg=document.getElementById('plan2d');
function render2D(p){const S=80,ox=130,baseY=1740;const X=x=>ox+x*S,Y=z=>baseY-z*S;const rect=(x,z,w,d,f,stroke='#111827',sw=6)=>`<rect x="${X(x)}" y="${Y(z+d)}" width="${w*S}" height="${d*S}" fill="${f}" stroke="${stroke}" stroke-width="${sw}"/>`;const line=(x1,z1,x2,z2)=>`<line x1="${X(x1)}" y1="${Y(z1)}" x2="${X(x2)}" y2="${Y(z2)}" stroke="#111827" stroke-width="7" stroke-linecap="square"/>`;const tx=(x,z,t,cls='lab')=>`<text x="${X(x)}" y="${Y(z)}" class="${cls}">${t}</text>`;let s=`<style>.lab{font:700 18px system-ui;fill:#0f172a;text-anchor:middle}.sm{font:600 14px system-ui;fill:#475569;text-anchor:middle}.door{stroke:#9a5f3b;stroke-width:4;fill:none}</style><rect x="20" y="20" width="1160" height="1960" rx="24" fill="#fff"/><text x="600" y="58" class="lab" style="font-size:25px">${p.name}</text><text x="600" y="84" class="sm">Casa principal 8×16 m · porche frontal 8×4 · porche trasero 8×2</text>`;s+=rect(0,16,8,2,'#eadfc9','#8b7355',3)+tx(4,17.15,'PORCHE TRASERO')+tx(4,16.75,'8×2','sm');s+=rect(0,0,8,16,'#f8fafc')+rect(8,14,4,2,'#e7f2fb')+rect(4.15,0,1,16,'#d1fae5','none',0);const gaps=p.roomDoors.map(d=>[d.z,d.z+.9]).sort((a,b)=>a[0]-b[0]);let cur=0;for(const [a,b]of gaps){if(a>cur)s+=line(4,cur,4,a);cur=b}if(cur<16)s+=line(4,cur,4,16);for(const b of p.boundaries){if(b.door){s+=line(0,b.z,2.65,b.z)+line(3.55,b.z,4,b.z)}else s+=line(0,b.z,4,b.z)}s+=line(4,12,4.15,12)+line(5.15,12,8,12);for(const sp of p.spaces)s+=tx(sp.x+sp.w/2,sp.z+sp.d/2+.12,sp.name)+tx(sp.x+sp.w/2,sp.z+sp.d/2-.18,sp.sub,'sm');s+=rect(0,-4,8,4,'#eadfc9','#8b7355',3)+tx(4,-2.1,'PORCHE FRONTAL')+tx(4,-2.45,'8×4','sm');s+=`<text x="80" y="120" class="sm" style="text-anchor:start">← IZQUIERDA: dormitorios</text><text x="650" y="120" class="sm" style="text-anchor:start">DERECHA: sala / comedor / cocina →</text>`;svg.innerHTML=s}
const canvas=document.getElementById('scene3d');const scene=new THREE.Scene();scene.background=new THREE.Color(0x0a1020);const renderer=new THREE.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));const camera=new THREE.PerspectiveCamera(48,1,.1,200);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.maxPolarAngle=Math.PI/2.02;scene.add(new THREE.HemisphereLight(0xe6f2ff,0x223344,1.5));const root=new THREE.Group();scene.add(root);const mats={wall:new THREE.MeshStandardMaterial({color:0xf3efe7}),floor:new THREE.MeshStandardMaterial({color:0xc9d4df}),porch:new THREE.MeshStandardMaterial({color:0xb8aa92}),annex:new THREE.MeshStandardMaterial({color:0xd6dee8}),wood:new THREE.MeshStandardMaterial({color:0x9d6d4d}),dark:new THREE.MeshStandardMaterial({color:0x273248}),acc:new THREE.MeshStandardMaterial({color:0x77a3ba}),glass:new THREE.MeshStandardMaterial({color:0x7fbad6,transparent:true,opacity:.5}),white:new THREE.MeshStandardMaterial({color:0xf8fafc})};function clearRoot(){while(root.children.length)root.remove(root.children[0])}function box(x,z,w,d,h,mat,y=h/2,g=root){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x+w/2,y,-(z+d/2));g.add(m);return m}function wallH(x1,x2,z){if(x2>x1)box(x1,z-.06,x2-x1,.12,2.8,mats.wall,1.4)}function wallV(x,z1,z2){if(z2>z1)box(x-.06,z1,.12,z2-z1,2.8,mats.wall,1.4)}function label(t,x,z){const c=document.createElement('canvas'),ctx=c.getContext('2d');c.width=512;c.height=128;ctx.fillStyle='rgba(8,14,28,.78)';ctx.fillRect(10,20,492,88);ctx.font='600 29px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#fff';ctx.fillText(t,256,64);const tex=new THREE.CanvasTexture(c);const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false}));sp.position.set(x,.18,-z);sp.scale.set(3.2,.8,1);root.add(sp)}function rebuild3D(p){clearRoot();box(0,0,8,16,.08,mats.floor,.04);box(0,-4,8,4,.08,mats.porch,.04);box(0,16,8,2,.08,mats.porch,.04);box(8,14,4,2,.08,mats.annex,.04);box(4.15,0,1,16,.018,new THREE.MeshStandardMaterial({color:0xa7f3d0,transparent:true,opacity:.22}),.058);wallH(0,4.15,0);wallH(5.15,8,0);wallH(0,4.15,16);wallH(5.15,8,16);wallV(0,0,16);wallV(8,0,14.45);wallV(8,15.35,16);wallV(12,14,16);wallH(8,12,14);wallH(8,12,16);const gaps=p.roomDoors.map(d=>[d.z,d.z+.9]).sort((a,b)=>a[0]-b[0]);let cur=0;for(const [a,b]of gaps){wallV(4,cur,a);cur=b}wallV(4,cur,16);for(const b of p.boundaries){if(b.door){wallH(0,2.65,b.z);wallH(3.55,4,b.z)}else wallH(0,4,b.z)}wallH(4,4.15,12);wallH(5.15,8,12);for(const r of p.spaces.filter(s=>s.t==='room')){const g=new THREE.Group();box(-.85,-.95,1.7,1.9,.24,mats.white,.18,g);g.position.set(r.x+r.w/2,0,-(r.z+r.d/2));root.add(g);label(r.name,r.x+r.w/2,r.z+r.d/2)}box(5.35,1.3,2.1,.8,.7,mats.acc,.35);box(5.55,6.75,1.9,.9,.76,mats.wood,.38);box(5.3,9.2,2.3,.62,.9,mats.white,.45);label('SALA',6,3);label('COMEDOR',6,7.5);label('COCINA',6,10.5);label('CORREDOR',6,14);label('BAÑO ANEXO',10,15);label('PORCHE FRONTAL',4,-2);label('PORCHE TRASERO',4,17);const grid=new THREE.GridHelper(32,32);grid.position.set(4,.01,-8);root.add(grid)}
const views={persp:{pos:[4,14,18],t:[4,0,-8],name:'Vista 3D'},front:{pos:[4,7,26],t:[4,1.2,-8],name:'Frente'},rear:{pos:[4,7,-40],t:[4,1.2,-8],name:'Fondo'},left:{pos:[-24,7,-8],t:[4,1.2,-8],name:'Izquierda'},right:{pos:[32,7,-8],t:[4,1.2,-8],name:'Derecha'}};let cam='persp',mode='3d',current='opt1';function setCam(k){cam=k;const v=views[k];camera.position.set(...v.pos);controls.target.set(...v.t);controls.update();document.querySelectorAll('[data-cam]').forEach(b=>b.classList.toggle('active',b.dataset.cam===k));document.getElementById('modePill').textContent=mode==='2d'?'Vista 2D':v.name}function updateInfo(){const p=plans[current];document.getElementById('summary').innerHTML=`<span>Habitaciones</span><b>${p.rooms}</b><span>Baños interiores</span><b>${p.baths}</b><span>Tamaño cuartos</span><b>${p.roomSize}</b><span>Tamaño baños</span><b>${p.bathSize}</b><span>Baño anexo</span><b>Se mantiene</b>`;document.getElementById('optionNote').innerHTML=p.note;document.getElementById('helpPill').textContent=p.name;document.getElementById('bottomText').textContent=current==='opt1'?'Opción 1: máxima amplitud en dormitorios.':'Opción 2: +1 habitación y +1 baño interior sin ampliar la casa.'}function applyPlan(){const p=plans[current];render2D(p);rebuild3D(p);updateInfo();if(mode==='3d')setCam(cam)}function setMode(m){mode=m;const is2d=m==='2d';document.getElementById('planWrap').classList.toggle('hidden',!is2d);canvas.classList.toggle('hidden',is2d);document.getElementById('btn2d').classList.toggle('active',is2d);document.getElementById('btn3d').classList.toggle('active',!is2d);document.getElementById('modePill').textContent=is2d?'Vista 2D':views[cam].name;if(!is2d){resize();setCam(cam)}}document.getElementById('designSelect').onchange=e=>{current=e.target.value;applyPlan()};document.getElementById('btn2d').onclick=()=>setMode('2d');document.getElementById('btn3d').onclick=()=>setMode('3d');document.querySelectorAll('[data-cam]').forEach(b=>b.onclick=()=>{setMode('3d');setCam(b.dataset.cam)});document.getElementById('menuBtn').onclick=()=>document.getElementById('panel').classList.toggle('open');function resize(){const w=canvas.clientWidth,h=canvas.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}window.addEventListener('resize',resize);resize();applyPlan();setCam('persp');renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)})
</script>
</body>
</html>
