</style></head><body><div id="app"><aside class="panel" id="panel"><h1>Casa 8×16 · Comparador</h1><p class="sub">Opción 3 ajustada: la Hab. 3 queda al final de la fila privada. Además, el hall trasero baja a 3×1 m y esos 0.3 m² pasan a la cocina, que ahora mide 3×3.2 m.</p><div class="card"><h2>Diseño</h2><select id="design"><option value="o1">Opción 1 · Original</option><option value="o2">Opción 2 · Premium lógica</option><option value="o3">Opción 3 · Suites iguales</option></select></div><div class="card"><h2>Vista</h2><div class="row"><button id="b3" class="btn mode active">◈ 3D</button><button id="b2" class="btn mode">▦ 2D</button></div></div><div class="card"><h2>Cámara 3D</h2><div class="row"><button class="btn active" data-cam="p">Perspectiva</button><button class="btn" data-cam="f">Frente</button><button class="btn" data-cam="r">Fondo</button></div></div><div class="card"><h2>Resumen</h2><div id="sum" class="compare"></div></div><div class="card"><h2>Notas</h2><div id="note" class="note"></div></div></aside><main id="stage"><button id="menu" class="btn mobile" style="position:absolute;left:10px;top:10px;z-index:8">☰</button><div class="hud"><div class="pill" id="hp">Opción 1</div><div class="pill" id="mp">Vista 3D</div></div><div id="planWrap" class="view hidden"><svg id="plan2d" viewBox="0 0 1100 1900" preserveAspectRatio="xMidYMid meet"></svg></div><canvas id="scene3d" class="view"></canvas><div class="bottom" id="bt"></div></main></div>

function o3(){const z1=4.6667,zC=6.6667,z2s=9.6667,z2e=11.3334,z3s=11.3334,z3e=13;return{name:'Opción 3 · Suites iguales',rooms:'4 iguales',room:'12 m² cada uno',baths:'Hab. 1–3 privados + anexo',vest:'Hab.1–3 ≈2.8 m² · Hab.4 = 3.3 m²',note:'Hab. 1 y 2 mantienen su distribución. En la Hab. 3, baño y vestidor quedan antes del dormitorio, y el dormitorio de 12 m² queda al final de la fila privada. Hab. 4 conserva vestidor de 3.3 m² y usa el baño anexo. El hall trasero pasa a 3×1 m y la cocina crece a 3×3.2 m = 9.6 m².',spaces:[['r1','HAB. 1','4×3 = 12 m²',0,0,4,3,'room'],['b1','BAÑO 1','2.3×1.67',0,3,2.3,1.6667,'bath'],['v1','VESTIDOR 1','1.7×1.67',2.3,3,1.7,1.6667,'closet'],['g','CLÓSET GENERAL','4×2 = 8 m²',0,z1,4,2,'closet'],['r2','HAB. 2','4×3 = 12 m²',0,zC,4,3,'room'],['b2','BAÑO 2','2.3×1.67',0,z2s,2.3,1.6667,'bath'],['v2','VESTIDOR 2','1.7×1.67',2.3,z2s,1.7,1.6667,'closet'],['b3','BAÑO 3','2.3×1.67',0,z3s,2.3,1.6666,'bath'],['v3','VESTIDOR 3','1.7×1.67',2.3,z3s,1.7,1.6666,'closet'],['r3','HAB. 3','4×3 = 12 m²',0,z3e,4,3,'room'],['h','PASILLO','1.0 m',4,0,1,16,'hall'],['s','SALA','3×4.2 = 12.6 m²',5,0,3,4.2,'social'],['d','COMEDOR','3×2.5 = 7.5 m²',5,4.2,3,2.5,'social'],['k','COCINA','3×3.2 = 9.6 m²',5,6.7,3,3.2,'kitchen'],['v4','VESTIDOR 4','3×1.1 = 3.3 m²',5,9.9,3,1.1,'closet'],['r4','HAB. 4','3×4 = 12 m²',5,11,3,4,'room'],['rh','HALL TRASERO','3×1 = 3.0 m²',5,15,3,1,'hall'],['a','BAÑO ANEXO','4×2',8,14,4,2,'bath']],walls:[H(0,4.05,0),H(4.95,8,0),H(0,4.05,16),H(4.95,8,16),V(0,0,16),V(8,0,15),V(8,15.9,16),V(12,14,16),H(8,12,14),H(8,12,16),V(4,0,.8),V(4,1.7,5.15),V(4,6.05,7.45),V(4,8.35,13.5),V(4,14.4,16),H(0,.45,3),H(1.25,2.7,3),H(3.5,4,3),V(2.3,3,z1),H(0,4,z1),H(0,4,zC),H(0,.45,z2s),H(1.25,2.7,z2s),H(3.5,4,z2s),V(2.3,z2s,z2e),H(0,4,z2e),V(2.3,z3s,z3e),H(0,.45,z3e),H(1.25,2.7,z3e),H(3.5,4,z3e),H(5,8,9.9),H(5,5.15,11),H(5.95,8,11),V(5,9.9,11.7),V(5,12.6,15),H(5,8,15)],doors:[D('e','h',4.05,0,.9,'n'),D('x','h',4.05,16,.9,'s'),D('r1','v',4,.8,.9,'w'),D('g','v',4,5.15,.9,'w'),D('r2','v',4,7.45,.9,'w'),D('r3','v',4,13.5,.9,'w'),D('b1','h',.45,3,.8,'n'),D('v1','h',2.7,3,.8,'n'),D('b2','h',.45,z2s,.8,'n'),D('v2','h',2.7,z2s,.8,'n'),D('b3','h',.45,z3e,.8,'n'),D('v3','h',2.7,z3e,.8,'n'),D('r4','v',5,11.7,.9,'e'),D('v4','h',5.15,11,.8,'s'),D('a','v',8,15,.9,'e')]}}
const P={o1:o1(),o2:o2(),o3:o3()},svg=document.getElementById('plan2d');
function draw2(p){const S=76,ox=110,by=1570,X=x=>ox+x*S,Y=z=>by-z*S,rc=(x,z,w,d,c)=>`<rect x="${X(x)}" y="${Y(z+d)}" width="${w*S}" height="${d*S}" fill="${c}" stroke="#cbd5e1"/>`,ln=w=>w.o==='h'?`<line x1="${X(w.a)}" y1="${Y(w.z)}" x2="${X(w.b)}" y2="${Y(w.z)}" class="wall"/>`:`<line x1="${X(w.x)}" y1="${Y(w.a)}" x2="${X(w.x)}" y2="${Y(w.b)}" class="wall"/>`,tx=(x,z,t,cl='lab')=>`<text x="${X(x)}" y="${Y(z)}" class="${cl}">${t}</text>`,C={room:'#fff',bath:'#e6f2fb',social:'#eef8ef',kitchen:'#fff6df',hall:'#d1fae5',closet:'#f2e9fb',utility:'#f7eee6'};let s=`<style>.wall{stroke:#111827;stroke-width:7}.lab{font:700 17px system-ui;fill:#0f172a;text-anchor:middle}.sm{font:600 12px system-ui;fill:#475569;text-anchor:middle}.door{stroke:#9a5f3b;stroke-width:4;fill:none}</style><rect x="20" y="20" width="1060" height="1860" rx="20" fill="#fff"/><text x="550" y="55" class="lab" style="font-size:24px">${p.name}</text>`;s+=rc(0,16,8,2,'#eadfc9')+tx(4,17.1,'PORCHE TRASERO')+rc(0,0,8,16,'#fff')+rc(8,14,4,2,C.bath);for(const a of p.spaces){if(a[0]==='a')continue;s+=rc(a[3],a[4],a[5],a[6],C[a[7]]||'#fff')}s+=p.walls.map(ln).join('');for(const d of p.doors){const r=d.l*S,x=X(d.x),y=Y(d.z);if(d.w==='h')s+=`<path d="M${x} ${y}h${r}" class="door"/>`;else s+=`<path d="M${x} ${y}v${-r}" class="door"/>`}for(const a of p.spaces){s+=tx(a[3]+a[5]/2,a[4]+a[6]/2+.1,a[1])+tx(a[3]+a[5]/2,a[4]+a[6]/2-.18,a[2],'sm')}s+=rc(0,-4,8,4,'#eadfc9')+tx(4,-2,'PORCHE FRONTAL');svg.innerHTML=s}
const c=document.getElementById('scene3d'),sc=new THREE.Scene();sc.background=new THREE.Color(0x0a1020);const rr=new THREE.WebGLRenderer({canvas:c,antialias:true});rr.setPixelRatio(Math.min(devicePixelRatio,2));const cam=new THREE.PerspectiveCamera(48,1,.1,200),ctl=new OrbitControls(cam,c);ctl.enableDamping=true;sc.add(new THREE.HemisphereLight(0xffffff,0x223344,1.7));const root=new THREE.Group();sc.add(root);const M={wall:new THREE.MeshStandardMaterial({color:0xf3efe7}),floor:new THREE.MeshStandardMaterial({color:0xc9d4df}),porch:new THREE.MeshStandardMaterial({color:0xb8aa92}),glass:new THREE.MeshStandardMaterial({color:0x7fbad6,transparent:true,opacity:.5}),bed:new THREE.MeshStandardMaterial({color:0xf8fafc}),closet:new THREE.MeshStandardMaterial({color:0xc9b6db})};function box(x,z,w,d,h,m,y=h/2,g=root){const q=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);q.position.set(x+w/2,y,-(z+d/2));g.add(q);return q}function clear(){while(root.children.length)root.remove(root.children[0])}function lab(t,x,z){const cn=document.createElement('canvas'),x2=cn.getContext('2d');cn.width=400;cn.height=90;x2.fillStyle='#08101ed9';x2.fillRect(0,10,400,70);x2.fillStyle='#fff';x2.font='600 24px system-ui';x2.textAlign='center';x2.fillText(t,200,53);const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cn),transparent:true,depthTest:false}));sp.position.set(x,.18,-z);sp.scale.set(2.8,.65,1);root.add(sp)}function draw3(p){clear();box(0,0,8,16,.08,M.floor,.04);box(0,-4,8,4,.08,M.porch,.04);box(0,16,8,2,.08,M.porch,.04);box(8,14,4,2,.08,M.floor,.04);for(const w of p.walls){if(w.o==='h')box(w.a,w.z-.06,w.b-w.a,.12,2.8,M.wall,1.4);else box(w.x-.06,w.a,.12,w.b-w.a,2.8,M.wall,1.4)}for(const a of p.spaces){if(a[7]==='room'){const g=new THREE.Group();box(-.75,-.9,1.5,1.8,.22,M.bed,.16,g);if(a[5]<a[6])g.rotation.y=Math.PI/2;g.position.set(a[3]+a[5]/2,0,-(a[4]+a[6]/2));root.add(g)}if(a[7]==='closet')box(a[3]+.08,a[4]+.08,Math.max(.2,a[5]-.16),Math.max(.2,a[6]-.16),1.4,M.closet,.7);lab(a[1],a[3]+a[5]/2,a[4]+a[6]/2)}lab('PORCHE FRONTAL',4,-2);lab('PORCHE TRASERO',4,17);const gr=new THREE.GridHelper(34,34);gr.position.set(4,.01,-8);root.add(gr)}
const vw={p:[[4,14,18],[4,0,-8],'Vista 3D'],f:[[4,7,26],[4,1,-8],'Frente'],r:[[4,7,-40],[4,1,-8],'Fondo']};let cur='o1',mode='3',cv='p';function setCam(k){cv=k;let v=vw[k];cam.position.set(...v[0]);ctl.target.set(...v[1]);ctl.update();document.querySelectorAll('[data-cam]').forEach(b=>b.classList.toggle('active',b.dataset.cam===k));document.getElementById('mp').textContent=mode==='2'?'Vista 2D':v[2]}function info(){let p=P[cur];document.getElementById('sum').innerHTML=`<span>Habitaciones</span><b>${p.rooms}</b><span>Dormitorio</span><b>${p.room}</b><span>Baños</span><b>${p.baths}</b><span>Vestidores</span><b>${p.vest}</b>`;document.getElementById('note').textContent=p.note;document.getElementById('hp').textContent=p.name;document.getElementById('bt').textContent=cur==='o3'?'Opción 3: cocina 3×3.2 m · hall trasero 3×1 m · Hab. 3 al final de la fila.':'Comparador de opciones.'}function apply(){draw2(P[cur]);draw3(P[cur]);info();setCam(cv)}function setMode(m){mode=m;let two=m==='2';document.getElementById('planWrap').classList.toggle('hidden',!two);c.classList.toggle('hidden',two);b2.classList.toggle('active',two);b3.classList.toggle('active',!two);if(!two){resize();setCam(cv)}else document.getElementById('mp').textContent='Vista 2D'}design.onchange=e=>{cur=e.target.value;apply()};b2.onclick=()=>setMode('2');b3.onclick=()=>setMode('3');document.querySelectorAll('[data-cam]').forEach(b=>b.onclick=()=>{setMode('3');setCam(b.dataset.cam)});menu.onclick=()=>panel.classList.toggle('open');function resize(){rr.setSize(c.clientWidth,c.clientHeight,false);cam.aspect=c.clientWidth/c.clientHeight;cam.updateProjectionMatrix()}addEventListener('resize',resize);resize();apply();setCam('p');rr.setAnimationLoop(()=>{ctl.update();rr.render(sc,cam)});
